<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beratung &amp; Formwirkung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Beratung & Formwirkung – Stil der Lernapp (vgl. zwischenpruefung.html) */
:root{
  --bg:#F5F3F7;--surface:#FFFFFF;--surface-2:#FAF8FC;--ink:#231B2E;--muted:#61586E;--line:#DDD6E6;
  --accent:#6D2E7F;--accent-ink:#FFFFFF;--accent-soft:#F1E4F6;--accent-hover:#5A2469;
  --good:#2F7D55;--good-soft:#E3F2EA;--bad:#B3362D;--bad-soft:#FBE6E3;
  --g-kopf:#E7E7EA;--g-kontur:#8C8C94;--g-haar:#8A8A92;--g-haar-kontur:#4C4C53;--g-hilfe:#A6A6AE;--g-flaeche:#EDEDF0;
  --shadow:0 1px 2px rgba(35,27,46,.05),0 6px 18px -6px rgba(35,27,46,.10);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;--r-s:10px;
  --t-xs:.8125rem;--t-s:.9375rem;--t-m:1.0625rem;--t-l:1.25rem;--t-xl:1.5rem;--t-2xl:1.875rem;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16121B;--surface:#201A28;--surface-2:#1B1622;--ink:#EEE8F4;--muted:#A99EB7;--line:#3A3045;
    --accent:#CFA2E0;--accent-ink:#1C1422;--accent-soft:#3A2A45;--accent-hover:#DDB9EA;
    --good:#6CC196;--good-soft:#1D3328;--bad:#EE8177;--bad-soft:#3E1F1C;
    --g-kopf:#3B3B41;--g-kontur:#8E8E97;--g-haar:#6E6E76;--g-haar-kontur:#B4B4BC;--g-hilfe:#74747C;--g-flaeche:#2C2C31;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16121B;--surface:#201A28;--surface-2:#1B1622;--ink:#EEE8F4;--muted:#A99EB7;--line:#3A3045;
  --accent:#CFA2E0;--accent-ink:#1C1422;--accent-soft:#3A2A45;--accent-hover:#DDB9EA;
  --good:#6CC196;--good-soft:#1D3328;--bad:#EE8177;--bad-soft:#3E1F1C;
  --g-kopf:#3B3B41;--g-kontur:#8E8E97;--g-haar:#6E6E76;--g-haar-kontur:#B4B4BC;--g-hilfe:#74747C;--g-flaeche:#2C2C31;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -8px rgba(0,0,0,.5);
}

/* Grundlagen und Browser-Oberflächen */
*{box-sizing:border-box}
html,body{margin:0}
html{scrollbar-color:var(--g-kontur) var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--t-m);line-height:1.6;caret-color:var(--accent);accent-color:var(--accent)}
::selection{background:var(--accent-soft);color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent);text-underline-offset:.2em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:var(--t-2xl);font-weight:800}
h2{font-size:var(--t-xl);font-weight:700}
h3{font-size:var(--t-l);font-weight:700}
p{margin:0;max-width:66ch}
ul,ol{margin:0}
strong{font-weight:700}

/* App-Leiste */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.appbar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:var(--t-l);letter-spacing:-.01em}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:var(--t-s);padding:7px 16px;border-radius:999px;cursor:pointer;min-height:36px;transition:background-color .18s var(--ease),color .18s var(--ease)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

/* Seitenrahmen */
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
.screen{display:flex;flex-direction:column;gap:16px}
@media (prefers-reduced-motion: no-preference){
  .screen{animation:rein .26s var(--ease)}
  @keyframes rein{from{opacity:.75;transform:translateY(8px)}to{opacity:1;transform:none}}
}
.pagehead{display:flex;flex-direction:column;gap:6px}
.pagehead .meta{color:var(--muted);font-size:var(--t-s)}
.tag{display:inline-block;font-size:var(--t-xs);font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px;vertical-align:middle}

/* Lernschritte */
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0;font-variant-numeric:tabular-nums}
.steps li{font-size:var(--t-xs);font-weight:700;padding:4px 10px;border-radius:999px;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.steps li.done{color:var(--accent);border-color:transparent;background:var(--accent-soft)}
.steps li.now{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}

/* Flächen */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.text{gap:12px}
.text ul,.text ol{padding-left:1.25em;display:flex;flex-direction:column;gap:6px}
.text li::marker{color:var(--accent)}
.note{font-size:var(--t-s);color:var(--muted)}
svg text{font-family:var(--f-body)}
.fig svg{display:block;width:100%;max-width:460px;height:auto;margin:0 auto}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair figure{margin:0;display:flex;flex-direction:column;gap:4px;text-align:center}
.pair figcaption{font-size:var(--t-s);font-weight:700;color:var(--muted)}

/* Bedienelemente */
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-s);padding:10px 16px;font:inherit;font-weight:700;font-size:var(--t-s);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px;transition:background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),transform .1s}
.btn:hover{border-color:var(--accent);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.btn svg{width:18px;height:18px;flex:none}
.nav{display:flex;justify-content:space-between;gap:10px}

/* Rückmeldungen */
.callout{border:1px solid var(--line);background:var(--surface-2);padding:12px 14px;border-radius:var(--r-s);display:flex;flex-direction:column;gap:4px}
.callout.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.callout.good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.callout.accent{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.answers{display:flex;flex-direction:column;gap:8px}
.answers .btn{justify-content:flex-start;text-align:left;font-weight:400;font-size:var(--t-m)}
.answers .btn.right,.imgchoice .btn.right{background:var(--good-soft);border-color:var(--good)}
.answers .btn.wrong,.imgchoice .btn.wrong{background:var(--bad-soft);border-color:var(--bad)}
.imgchoice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgchoice .btn{flex-direction:column;padding:8px}

/* Winkel-Labor */
.range{display:flex;flex-direction:column;gap:6px}
.range label{font-weight:700}
.range input{width:100%;min-height:32px}
.meter{display:flex;flex-direction:column;gap:4px}
.meter-bar{position:relative;height:12px;border-radius:999px;background:linear-gradient(90deg,var(--g-flaeche),var(--accent-soft));border:1px solid var(--line)}
.meter-bar span{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);transform:translate(-50%,-50%);transition:left .2s var(--ease)}
.meter-lbl{display:flex;justify-content:space-between;font-size:var(--t-xs);color:var(--muted)}
.merksatz{font-family:var(--f-display);font-size:var(--t-xl);font-weight:800;line-height:1.3;text-align:center;text-wrap:balance;color:var(--accent);padding:8px 0}

/* Wissen: Kapitelliste */
.kapitel-liste{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.kapitel-liste li+li{border-top:1px solid var(--line)}
.kapitel-liste button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:12px;width:100%;padding:14px 16px;cursor:pointer;transition:background-color .16s var(--ease)}
.kapitel-liste button:hover{background:var(--surface-2)}
.kapitel-liste button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.kapitel-liste .nr{font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:var(--t-l);font-variant-numeric:tabular-nums}
.kapitel-liste .tt{font-weight:700;display:block}
.kapitel-liste .ks{display:block;color:var(--muted);font-size:var(--t-s);line-height:1.45}
.kapitel-liste svg{width:18px;height:18px;color:var(--muted)}

/* Wissen: Kapitelseite */
.lesen{display:flex;flex-direction:column;gap:14px}
.lesen h3{margin-top:10px}
.lesen .lead{font-size:var(--t-l);line-height:1.5;color:var(--ink)}
.lesen blockquote{margin:0;padding:4px 0 4px 16px;border-left:1px solid var(--line);font-family:var(--f-display);font-size:var(--t-l);font-weight:500;line-height:1.4}
.lesen blockquote cite{display:block;font-family:var(--f-body);font-style:normal;font-size:var(--t-s);color:var(--muted);margin-top:4px}
.lesen dl{margin:0;display:grid;grid-template-columns:minmax(7.5em,max-content) 1fr;gap:8px 16px}
.lesen dt{font-weight:700}
.lesen dd{margin:0}
@media (max-width:520px){.lesen dl{grid-template-columns:1fr;gap:2px}.lesen dd{margin-bottom:8px}}
.ablauf{list-style:none;padding:0 !important;counter-reset:s;display:flex;flex-direction:column;gap:0 !important}
.ablauf>li{counter-increment:s;display:grid;grid-template-columns:2.4em 1fr;column-gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ablauf>li:first-child{border-top:0;padding-top:0}
.ablauf>li::before{content:counter(s);font-family:var(--f-display);font-weight:800;font-size:var(--t-xl);color:var(--accent);line-height:1.1;font-variant-numeric:tabular-nums}
.ablauf>li>div{display:flex;flex-direction:column;gap:6px}
.ablauf h3{margin:0;font-size:var(--t-m)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.harmonie{list-style:none;padding:0 !important;margin:0;display:flex;flex-direction:column;gap:0 !important}
.harmonie li{display:grid;grid-template-columns:40px 1fr;column-gap:14px;row-gap:6px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.harmonie li:first-child{border-top:0}
.harmonie li svg{width:40px;height:40px;grid-row:span 2}
.harmonie .zonen{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--t-s);color:var(--muted)}
.mittel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px 10px;max-width:340px;margin:0 auto}
.mittel figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.mittel figure svg{width:64px;height:64px}
.mittel figcaption{font-size:var(--t-s);font-weight:700}
.mittel-pfeil svg{width:56px;height:24px;display:block}
.lesen dl.sml{grid-template-columns:5em 1fr}
@media (max-width:520px){.lesen dl.sml{grid-template-columns:5em 1fr;gap:6px 10px}.lesen dl.sml dd{margin-bottom:0}}
.faelle{display:flex;flex-wrap:wrap;gap:8px}
.wrap.breit{max-width:1120px}
.bk-grid{display:grid;gap:16px;align-items:start}
@media (min-width:900px){.bk-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}.bk-fig{position:sticky;top:76px}}
.bk-fig svg{max-width:420px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:var(--t-s);font-weight:700;min-height:38px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip[disabled]{opacity:.45;cursor:default}
.punkt{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.wahl{border:0;margin:0;padding:0;min-width:0}
.wahl legend{font-weight:700;padding:0;margin-bottom:8px}
.bk-wahl{gap:18px}
.ansichten{justify-content:center}
.werkzeuge{padding-top:10px;border-top:1px solid var(--line)}
#bk-marker{transition:left .9s var(--ease)}
@media (prefers-reduced-motion: no-preference){.sim-in{animation:simIn .9s var(--ease)}@keyframes simIn{from{opacity:0}to{opacity:1}}}
.tabelle{overflow-x:auto}
.tabelle table{border-collapse:collapse;width:100%;min-width:480px;font-size:var(--t-s)}
.tabelle th,.tabelle td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tabelle th{font-size:var(--t-xs);color:var(--muted);font-weight:700}
.tabelle td svg{width:34px;height:34px;display:block}
.hell,.dunkel{display:inline-block;font-weight:700;font-size:var(--t-xs);padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.hell{background:#F4EEDF;color:#3B2F1C}
.dunkel{background:#3A2C22;color:#F4EEDF;border-color:#3A2C22}
.quelle{font-size:var(--t-xs);color:var(--muted)}
.grafik{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:12px}
.grafik svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto}
.drei{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.drei figure{margin:0;text-align:center;display:flex;flex-direction:column;gap:4px}
.drei figcaption{font-size:var(--t-xs);line-height:1.35;color:var(--muted)}
.drei figcaption strong{color:var(--ink);font-size:var(--t-s)}
</style>
</head>
<body>
<header class="appbar"><div class="appbar-in" id="bar"></div></header>
<main class="wrap" id="app"></main>
<script>
(function(){
  // ---------- Lehrgrafik (SVG) ----------
  // Stil wie Fach-Skizze: Kopf als Linienzeichnung, Kopfhaut fein gestrichelt,
  // Haarform als kräftig gestrichelte Umrisslinie, keine Füllungen.
  // Ebenen: kopf (fix) · haar (je Zustand) · nase (fix, obenauf) · Einblendungen
  var NASE = "M293,227 C306,246 322,266 340,282 C350,290 351,300 342,304 C332,307 318,304 309,307";
  var GESICHT = "M296,132 C299,142 301,152 301,160 C304,182 302,198 299,208 C301,214 297,221 293,227 " +
    NASE.slice(NASE.indexOf("C")) +
    " C314,309 319,313 318,318 C317,321 313,323 309,324 C313,327 316,332 313,337 C310,341 305,342 302,344 C299,347 300,351 303,357 C308,367 306,379 296,385 C285,391 268,392 254,391 C244,392 236,400 230,414 L220,438";
  var NACKEN = "M156,364 L148,376 C150,396 150,418 147,440";
  var KOPFHAUT = "M150,372 L142,352 C118,328 92,298 84,262 C76,226 76,172 98,130 C118,94 162,72 214,74 C258,76 290,104 296,132";
  var ANSATZ = "M296,132 C284,160 270,190 262,200 L258,226 C246,222 232,208 214,210 C200,206 184,212 180,228 C176,260 168,320 150,372";
  var ANSATZ_REV = " C168,320 176,260 180,228 C184,212 200,206 214,210 C232,208 246,222 258,226 L262,200 C270,190 284,160 296,132 Z";
  var OHR = "M186,224 C199,212 217,220 215,243 C213,262 207,276 199,287 C195,293 190,295 188,290" +
    " M192,234 C203,229 209,241 205,256 C203,264 198,266 196,260";
  var AUGE =
    // Braue, Auge mit Iris und Wimpern, Mundlinie, Ohrstecker
    '<path d="M244,206 C254,197 272,195 287,201 C273,199 258,201 245,209 Z" fill="var(--ink)"/>' +
    '<path d="M253,224 C260,216 274,215 283,221" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>' +
    '<path d="M256,229 C264,234 274,233 281,226" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>' +
    '<circle cx="268" cy="224.5" r="5.2" fill="none" stroke="var(--ink)" stroke-width="1.6"/><circle cx="268" cy="224.5" r="2.8" fill="var(--ink)"/>' +
    '<path d="M281,220 l6,-3 M277,217.5 l4.5,-4.5 M272,216 l2.5,-5" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>' +
    '<path d="M309,324 Q303,326 297,323" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/>' +
    '<circle cx="192" cy="289" r="3.6" fill="var(--ink)"/>';
  function kopf(){
    return '<g class="kopf" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="' + ANSATZ + '" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="1.5 4.5"/>' +
      '<path d="' + GESICHT + '" stroke="var(--ink)" stroke-width="2.6"/>' +
      '<path d="' + NACKEN + '" stroke="var(--ink)" stroke-width="2.6"/>' +
      '<path d="' + OHR + '" stroke="var(--ink)" stroke-width="2.3"/>' +
      '</g>' + AUGE;
  }
  var NASENSPITZE = [348, 294];
  var OHRSPITZE = [203, 216];
  // Diagonale: Nasenspitze – Ohrspitze, nach hinten verlängert. Dort gehört das Volumen hin.
  var DIAG = (function(){
    var dx = OHRSPITZE[0] - NASENSPITZE[0], dy = OHRSPITZE[1] - NASENSPITZE[1], l = Math.sqrt(dx*dx + dy*dy);
    return {ux:dx / l, uy:dy / l, vorne:l};
  })();
  function aufDiag(L){ return [OHRSPITZE[0] + DIAG.ux * L, OHRSPITZE[1] + DIAG.uy * L]; }

  // Haarformen: Start am Stirnansatz + 5 Bézier-Segmente bis zum Nacken (gleicher Aufbau, daher überblendbar)
  var FORM = {
    // A: flach, liegt eng am Kopf
    A:    [296,132, 293,94,258,66,208,66, 156,66,106,90,88,130, 72,166,70,214,76,254, 78,292,98,328,128,352, 138,360,146,366,150,372],
    // B: Volumen auf der Diagonale am oberen Hinterkopf, Nacken eng
    B:    [296,132, 294,84,254,46,190,44, 124,42,58,62,34,110, 18,146,26,200,52,240, 64,280,94,318,128,350, 138,358,146,366,150,372],
    // Fehler: Volumen im Nacken
    tief: [296,132, 293,94,258,66,208,66, 156,66,106,90,88,130, 70,170,66,222,68,262, 58,320,70,380,110,392, 130,398,146,388,150,372],
    // Fehler: Volumen nur ganz oben
    hoch: [296,132, 300,64,250,22,184,22, 120,22,76,60,70,124, 68,170,70,214,76,254, 78,292,98,328,128,352, 138,360,146,366,150,372]
  };
  FORM.M = FORM.A.map(function(v, i){ return (v + FORM.B[i]) / 2; });
  function pfadAus(p){

    if (art === "mittel") s += pfeil(410, 240, 410, 50, c, 5) + pfeil(410, 240, 410, 430, c, 5);
    if (art === "hell")   s += pfeil(262, 92, 372, 92, c, 5) + pfeil(420, 330, 318, 330, c, 5);
    return s + '</svg>';
  }

  // Harmonie-Formen (Seite 9)
  function harmonieTabelle(){
    var H = '<span class="hell">hell</span>', D = '<span class="dunkel">dunkel</span>', G = 'eine globale Farbe';
    var zeilen = [
      ["kreis", "Kreis", G, G, G],
      ["quadrat", "Viereck", G, G, G],
      ["hoch", "Rechteck hochwärts", H, D, H],
      ["breit", "Rechteck breitwärts", D, H, D],
      ["oben", "Dreieck, Spitze nach oben", D + ' (Spitze)', H + ' (breiter Teil)', H + ' (breiter Teil)'],
      ["unten", "Dreieck, Spitze nach unten", H + ' (breiter Teil)', H + ' (breiter Teil)', D + ' (Spitze)'],
      ["raute", "Raute", D + ' (Spitze)', H + ' (breiter Teil)', D + ' (Spitze)']
    ];
    return '<ul class="harmonie">' + zeilen.map(function(z){
        return '<li>' + form(z[0]) + '<strong>' + z[1] + '</strong><div class="zonen">' +
          (z[2] === G ? '<span>Eine globale Farbe, ohne Hell-Dunkel-Aufteilung</span>'
            : '<span>Oberkopf ' + z[2] + '</span><span>Seiten ' + z[3] + '</span><span>Nacken ' + z[4] + '</span>') + '</div></li>';
      }).join("") + '</ul>';
  }


  // Ablauf Diagnose – Technik – Ergebnis (Seite 11)
  function ablaufGrafik(){
    var box = function(y, titel, text){
      return '<rect x="10" y="' + y + '" width="272" height="66" rx="10" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>' +
        '<text x="30" y="' + (y + 28) + '" font-size="19" font-weight="700" fill="var(--accent)">' + titel + '</text>' +
        '<text x="30" y="' + (y + 52) + '" font-size="16" fill="var(--ink)">' + text + '</text>';

    return '<svg viewBox="0 0 330 262" role="img" aria-label="Diagnose, Technik, Ergebnis" style="max-width:360px">' +
      box(8, "Diagnose", "5 Minuten") + box(98, "Technik", "Schnitt, Farbe, Frisur, Service") + box(188, "Ergebnis", "Stil, Trend") +
      pfeil(146, 74, 146, 96, "var(--ink)", 2) + pfeil(146, 164, 146, 186, "var(--ink)", 2) +
      '<path d="M282,221 L312,221 L312,41 L292,41" fill="none" stroke="var(--g-kontur)" stroke-width="2" stroke-dasharray="5 5"/>' + pfeil(300, 41, 284, 41, "var(--g-kontur)", 2) +
      '</svg>';
  }

  // Farb-Barometer (Seite 12)
  function barometer(){
    var y = function(n){ return 24 + (10 - n) * 30; }, s = '<svg viewBox="0 0 336 318" style="max-width:420px" role="img" aria-label="Farb-Barometer von 1 bis 10">';
    for (var n = 10; n >= 1; n--){
      s += '<text x="40" y="' + (y(n) + 6) + '" text-anchor="end" font-size="18" font-weight="800" fill="var(--ink)" style="font-family:var(--f-display)">' + n + '</text>';
    }
    var linie = function(yy, x2){ return '<line x1="26" y1="' + yy + '" x2="' + x2 + '" y2="' + yy + '" stroke="var(--g-kontur)" stroke-width="1.5" stroke-dasharray="6 5"/>'; };
    s += linie(y(7.5), 300) + linie(y(4.5), 300) + linie(y(2.5), 300);
    s += '<text x="60" y="' + (y(8) + 6) + '" font-size="15" font-weight="700" fill="var(--ink)">Gesichtsfarbe Europäer, Durchschnitt</text>';
    s += '<line x1="70" y1="' + (y(7.5) + 4) + '" x2="70" y2="' + (y(4.5) - 4) + '" stroke="var(--ink)" stroke-width="2"/>' + pfeil(70, y(5), 70, y(4.5) - 2, "var(--ink)", 2);
    s += '<text x="84" y="' + (y(6) + 6) + '" font-size="16" font-weight="800" fill="var(--accent)">LARGE</text>';
    s += '<text x="84" y="' + (y(4) + 6) + '" font-size="16" font-weight="800" fill="var(--accent)">SMALL</text>';
    s += '<text x="84" y="' + (y(3) + 6) + '" font-size="15" font-weight="700" fill="var(--ink)">Gesichtsfarbe Südländer</text>';
    s += '<line x1="316" y1="' + (y(2.5) - 2) + '" x2="316" y2="' + (y(4.5) + 4) + '" stroke="var(--ink)" stroke-width="2"/>' + pfeil(316, y(3.5), 316, y(4.5) + 2, "var(--ink)", 2);
    return s + '</svg>';
  }

  // ---------- Wissen: Kapitel aus dem Unterrichtsmaterial (Seite 1–16) ----------
  var KAPITEL = [
    {t:"Leitfaden für eine Beratung", s:"Seite 1–2", k:"Sieben Schritte vom Beratungsplatz bis zum Ergebnis.", html: function(){ return '' +

      '<div class="callout accent"><h3>Ergebnis</h3><p>Die Kundin hat selbst entschieden. Sie kauft ein Ergebnis von uns.</p></div>'; }},

    {t:"Beratung mit Herz", s:"Seite 3", k:"Kommunikation, Kompetenz, Beratung. Welcher Baum bist du?", html: function(){ return '' +

    {t:"Fundament, Mauern und dann das Dach", s:"Seite 4", k:"Das Gesicht als Haus. Harmonie, Charakter und was eine Frisur im Gesicht bewirkt.", html: function(){ return '' +

    {t:"Kunden locken, Fans suchen Leistung", s:"Seite 5", k:"Beratungsablauf, Pflegetyp oder Stylingtyp, die Sprache der Kunden.", html: function(){ return '' +

    {t:"Gesichtsmerkmale ausgleichen", s:"Seite 6", k:"Nase, Augen, Ohren, Lippe und Gesichtsformen. Mit welcher Frisur man sie ausgleicht.", html: function(){ return '' +
      '<dl>' +
      '<dt>Doppelkinn</dt><dd>Mehr Volumen am Oberkopf.</dd>' +
      '<dt>Große Nase (Seitenprofil)</dt><dd>Mehr Hinterkopf betonen.<br><button class="btn" type="button" data-act="goPilot" style="margin-top:8px">Im Fall „Nase im Profil“ ansehen ' + ICON_WEITER + '</button></dd>' +

      '<dt>Abstehende Ohren</dt><dd>Lange Haare, die die Ohren bedecken, oder eine Frisur mit seitlichem Scheitel. Auch ein seitlich gesteckter Zopf oder Volumen am Oberkopf lenkt die Aufmerksamkeit von den Ohren ab.</dd>' +

    {t:"Haarfarbe und Wirkung", s:"Seite 6–7", k:"Wie die Haarfarbe Gesichtsform, Teint und Volumen verändert.", html: function(){ return '' +

    {t:"Tonhöhe und Profil", s:"Seite 10", k:"Tonhöhentabelle 2 bis 11 und was dunkle, mittlere und helle Töne im Profil bewirken.", html: function(){ return '' +

  };
  function profilAuge(art){
    var y = {mandel:0, rund:0, schmal:0, haengend:2}[art] || 0, h = {mandel:1, rund:1.35, schmal:0.65, haengend:1}[art] || 1;
    return '<path d="M254,' + (224 + y) + ' C261,' + (224 - 8 * h) + ' 275,' + (224 - 9 * h) + ' 283,' + 221 + '" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>' +
      '<path d="M256,' + (229 + y) + ' C264,' + (229 + 4 * h) + ' 274,' + (229 + 3 * h) + ' 281,226" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>' +
      '<circle cx="268" cy="' + (224.5 + y / 2) + '" r="' + (4.6 * Math.min(1.1, h)).toFixed(1) + '" fill="none" stroke="var(--ink)" stroke-width="1.6"/><circle cx="268" cy="' + (224.5 + y / 2) + '" r="2.6" fill="var(--ink)"/>';
  }
  function profilBraue(art){
    if (art === "gerade") return '<path d="M245,206 L286,203" stroke="var(--ink)" stroke-width="4.4" stroke-linecap="round"/>';
    if (art === "kantig") return '<path d="M245,209 L270,198 L287,203" fill="none" stroke="var(--ink)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>';
    return '<path d="M244,206 C254,197 272,195 287,201 C273,199 258,201 245,209 Z" fill="var(--ink)"/>';
  }
  function bkProfil(k, links, o){
    var id = ++uid, s = svgKopf("20 20 360 470", o.label, o.attr), kurzH = k.frisur === "kurz" || k.frisur === "oben" || k.frisur === "hinterkopf";
    s += '<g' + (links ? ' transform="translate(400,0) scale(-1,1)"' : '') + '>';
    s += haarPfad(P_HAAR[k.frisur]);
    s += '<g fill="none" stroke-linecap="round" stroke-linejoin="round">' +
      (kurzH ? '<path d="' + ANSATZ + '" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="1.5 4.5"/>' : '') +
      '<path d="' + P_GESICHT + '" stroke="var(--ink)" stroke-width="2.6"/>' +
      '<path d="' + NACKEN + '" stroke="var(--ink)" stroke-width="2.6"/>' +
      (kurzH ? '<path d="' + OHR + '" stroke="var(--ink)" stroke-width="2.3"/>' : '') + '</g>';
    if (k.pony !== "kein") s += haarPfad(P_PONY[k.pony]);
    s += profilBraue(k.brauen) + profilAuge(k.augen) + '<path d="M309,324 Q303,326 297,323" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/>';
    if (kurzH) s += '<circle cx="192" cy="289" r="3.2" fill="var(--ink)" opacity="0"/>';
    if (k.bart === "voll" || k.bart === "stoppeln") s += bartPfad(P_BART.voll + " " + P_BART.schnurr, k.bart, id);
    if (k.bart === "kinn" || k.bart === "schnurr") s += bartPfad(P_BART[k.bart], k.bart, id);
    return s + '</g>' + (o.innen || '') + '</svg>';
  }

  // ---------- Hinten ----------
  var H_HAAR = {
    kurz:       "M200,82 C266,82 314,130 314,208 C314,256 300,288 286,300 C262,322 232,334 200,336 C168,334 138,322 114,300 C100,288 86,256 86,208 C86,130 134,82 200,82 Z",
    oben:       "M200,44 C274,44 318,114 316,206 C316,256 300,288 286,300 C262,322 232,334 200,336 C168,334 138,322 114,300 C100,288 84,256 84,206 C82,114 126,44 200,44 Z",
    hinterkopf: "M200,80 C276,80 334,128 332,200 C330,252 306,290 286,302 C262,322 232,334 200,336 C168,334 138,322 114,302 C94,290 70,252 68,200 C66,128 124,80 200,80 Z",
    seitlich:   "M200,78 C270,78 326,126 336,196 C346,256 322,300 288,312 C262,326 232,334 200,336 C168,334 138,326 112,312 C78,300 54,256 64,196 C74,126 130,78 200,78 Z",
    bob:        "M200,78 C270,78 320,126 322,204 C324,270 326,330 322,366 C282,372 240,374 200,374 C160,374 118,372 78,366 C74,330 76,270 78,204 C80,126 130,78 200,78 Z",
    lang:       "M200,78 C270,78 322,126 324,206 C326,300 334,400 330,482 L70,482 C66,400 74,300 76,206 C78,126 130,78 200,78 Z"
  };
  function bkHinten(k, o){
    var s = svgKopf("40 20 320 470", o.label, o.attr), kurzH = k.frisur === "kurz" || k.frisur === "oben" || k.frisur === "hinterkopf";
    s += '<g fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"><path d="M164,318 C162,380 160,440 158,490 M236,318 C238,380 240,440 242,490"/></g>';
    if (kurzH) s += '<path d="M100,226 C84,222 78,246 83,264 C88,280 96,288 106,284 M300,226 C316,222 322,246 317,264 C312,280 304,288 294,284" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.3" stroke-linecap="round"/>';
    s += haarPfad(H_HAAR[k.frisur]);
    if (kurzH) s += '<path d="M112,294 C140,320 176,332 200,334 C224,332 260,320 288,294" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="1.5 4.5" stroke-linecap="round"/>';
    if (k.frisur === "hinterkopf") s += '<ellipse cx="200" cy="190" rx="96" ry="56" fill="var(--accent)" fill-opacity=".12"/>' + txt(200, 196, "Volumen", {size:14, anchor:"middle", fill:"var(--accent)"});
    return s + (o.innen || '') + '</svg>';
  }

  function kopfAnsicht(k, ans, o){
    o = o || {};
    o.label = o.label || ("Kopf, Ansicht " + ans);
    if (ans === "profilr" || ans === "profill") return bkProfil(k, ans === "profill", o);
    if (ans === "hinten") return bkHinten(k, o);
    return bkVorne(k, o);
  }

  // ---------- Bausteine ----------
  function card(figHtml, textHtml){
    return (figHtml ? '<section class="card fig">' + figHtml + '</section>' : '') +
      '<section class="card text">' + textHtml + '</section>';
  }
  function controls(inner){ return '<div class="controls">' + inner + '</div>'; }
  function toggle(key, label, on){
    return '<button class="btn' + (on?' on':'') + '" type="button" aria-pressed="' + on + '" data-act="toggle" data-key="' + key + '">' + label + '</button>';
  }
  function seg(key, opts, val){
    return opts.map(function(o){
      var on = o[0]===val;
      return '<button class="btn' + (on?' on':'') + '" type="button" aria-pressed="' + on + '" data-act="set" data-key="' + key + '" data-val="' + o[0] + '">' + o[1] + '</button>';
    }).join("");
  }


  // ---------- App-Rahmen ----------
  function neuStart(){ return {hd:"A", hdHilfe:true, fehlerHd:"umgekehrt", ans1:"profil", ans2:"vorne", bk:st.bk, bkAnim:false, bkVon:null, view:st.view, fall:st.fall, kap:st.kap, hilfe:true, pony:"A", fehlerAuge:"schwer", screen:0, ohr:true, hair:"A", zonen:true, schaedel:false, winkel:0, fehler:"tief", q:0, picked:null, score:0}; }

  function renderPilot(){
    var SC = fall().screens, S = SC[st.screen];
    var steps = '<ol class="steps" aria-label="Lernschritte">' + STEPS.map(function(t,i){
      var c = i < S.step ? "done" : (i === S.step ? "now" : "");
      return '<li class="' + c + '"' + (i===S.step?' aria-current="step"':'') + '>' + t + '</li>';
    }).join("") + '</ol>';
    var last = st.screen === SC.length-1;
    var nav = '<div class="nav">' +
      '<button class="btn" type="button" data-act="prev"' + (st.screen===0?' disabled':'') + '>' + ICON_ZURUECK + 'Zurück</button>' +
      (last ? '<button class="btn primary" type="button" data-act="restart">Von vorne</button>'
            : '<button class="btn primary" type="button" data-act="next">' + (st.screen===0 ? "Los geht’s" : "Weiter") + ICON_WEITER + '</button>') +
      '</div>';
    var wahl = '<div class="faelle" role="group" aria-label="Fall wählen">' + Object.keys(FAELLE).map(function(k, i){
        var on = k === st.fall;
        return '<button class="btn' + (on ? ' on' : '') + '" type="button" aria-pressed="' + on + '" data-act="fall" data-val="' + k + '">Fall ' + (i + 1) + ': ' + FAELLE[k].kurz + '</button>';
      }).join("") + '</div>';
    return '<div class="screen">' + wahl + '<div class="pagehead"><h1>' + fall().titel + ' <span class="tag">V1</span></h1></div>' +
      steps + S.render() + nav + '</div>';
  }

  function render(){
    document.getElementById("bar").innerHTML =
      '<span class="brand">Beratung &amp; Formwirkung</span>' +
      '<nav class="tabs" aria-label="Bereiche">' +
        '<button type="button" data-act="view" data-val="pilot"' + (st.view==="pilot" ? ' aria-current="page"' : '') + '>Fälle</button>' +
        '<button type="button" data-act="view" data-val="baukasten"' + (st.view==="baukasten" ? ' aria-current="page"' : '') + '>Baukasten</button>' +
        '<button type="button" data-act="view" data-val="wissen"' + (st.view==="wissen" ? ' aria-current="page"' : '') + '>Wissen</button>' +
      '</nav>';
    var app = document.getElementById("app");
    app.classList.toggle("breit", st.view === "baukasten");
    app.innerHTML = st.view === "wissen" ? renderWissen() : st.view === "baukasten" ? renderBaukasten() : renderPilot();
  }

  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
    var a = b.dataset.act, moved = false;
    if (a==="view"){ if (st.view !== b.dataset.val){ st.view = b.dataset.val; moved = true; } }
    if (a==="kap"){ st.kap = +b.dataset.val; moved = true; }
    if (a==="goPilot"){ st.view = "pilot"; st.fall = "nase"; st = neuStart(); moved = true; }
    if (a==="goFall" || a==="fall"){ st.view = "pilot"; st.fall = b.dataset.val; st = neuStart(); moved = true; }
    if (a==="next"){ st.screen = Math.min(st.screen+1, fall().screens.length-1); moved = true; }
    if (a==="prev"){ st.screen = Math.max(st.screen-1, 0); moved = true; }
    if (a==="restart"){ st = neuStart(); moved = true; }
    if (a==="toggle"){ st[b.dataset.key] = !st[b.dataset.key]; }
    if (a==="set"){ if (b.dataset.key === "bkvgl") st.bk.vergleich = b.dataset.val; else st[b.dataset.key] = b.dataset.key === "winkel" ? +b.dataset.val : b.dataset.val; }
    if (a==="bk"){ st.bk[b.dataset.key] = b.dataset.val; st.bk.vorher = null; st.bk.vergleich = null; st.bkAnim = false; bkSpeichern(); }
    if (a==="bktoggle"){ st.bk[b.dataset.key] = !st.bk[b.dataset.key]; if (!st.bk.zeichnen) st.bk.radieren = false; st.bkAnim = false; bkSpeichern(); }
    if (a==="bkset"){ st.bk[b.dataset.key] = b.dataset.key === "dicke" ? +b.dataset.val : b.dataset.val; if (b.dataset.key !== "ansicht") st.bk.radieren = false; st.bkAnim = false; bkSpeichern(); }
    if (a==="bkradier"){ st.bk.radieren = !st.bk.radieren; st.bkAnim = false; }
    if (a==="bkundo"){ st.bk.striche.pop(); st.bkAnim = false; bkSpeichern(); }
    if (a==="bkleer"){ st.bk.striche = []; st.bkAnim = false; bkSpeichern(); }
    if (a==="bkzurueck"){ Object.assign(st.bk, st.bk.vorher); st.bk.vorher = null; st.bk.vergleich = null; st.bkAnim = false; bkSpeichern(); }
    if (a==="bksim"){
      var basis = st.bk.vorher ? Object.assign({}, st.bk, st.bk.vorher) : st.bk, beste = bkBeste(basis);
      st.bkVon = bkScore(basis);
      st.bk.vorher = {frisur:basis.frisur, pony:basis.pony, bart:basis.bart};
      st.bk.frisur = beste.frisur; st.bk.pony = beste.pony; st.bk.bart = beste.bart; st.bk.vergleich = "nachher";
      st.bkAnim = true; bkSpeichern();
      render();
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ var m = document.getElementById("bk-marker"); if (m) m.style.left = (bkScore(st.bk) * 100).toFixed(0) + "%"; }); });
      setTimeout(function(){ st.bkAnim = false; }, 1000);
      return;
    }
    if (a!=="bksim" && a!=="bk") st.bkAnim = false;
    if (a==="pick"){ st.picked = +b.dataset.i; if (st.picked === fall().fragen[st.q].r) st.score++; }
    if (a==="nextQ"){ st.q++; st.picked = null; }
    if (a==="checkReset"){ st.q = 0; st.picked = null; st.score = 0; }
    render();
    if (moved) window.scrollTo(0,0);
  });

  // Regler: nur Grafik und Text neu zeichnen, damit der Regler beim Ziehen bedienbar bleibt
  document.addEventListener("input", function(e){
    if (e.target.id !== "winkel") return;
    st.winkel = +e.target.value;
    document.getElementById("winkelFig").innerHTML = winkelFig(st.winkel);
    document.getElementById("winkelText").innerHTML = winkelText(st.winkel);
    document.querySelectorAll('[data-key="winkel"]').forEach(function(b){
      var on = +b.dataset.val === st.winkel; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
    });
  });

  // Zeichnen im Baukasten
  var NS = "http://www.w3.org/2000/svg", bkZug = null;
  function bkPunkt(e){
    var svg = document.querySelector("#bk-bild svg"), pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    var q = pt.matrixTransform(svg.getScreenCTM().inverse());
    return [q.x, q.y];
  }
  function bkRadiere(p){
    var vorher = st.bk.striche.length;
    var ans = st.bk.ansicht || "vorne"; st.bk.striche = st.bk.striche.filter(function(z){ return (z.v || "vorne") !== ans || !z.p.some(function(q){ return Math.hypot(q[0]-p[0], q[1]-p[1]) < 10; }); });
    if (st.bk.striche.length !== vorher){ document.getElementById("bk-striche").innerHTML = st.bk.striche.filter(function(z){ return (z.v || "vorne") === ans; }).map(bkStrich).join(""); bkSpeichern(); }
  }
  document.addEventListener("pointerdown", function(e){
    if (e.target.id !== "bk-flaeche") return;
    e.preventDefault(); e.target.setPointerCapture(e.pointerId);
    var p = bkPunkt(e);
    if (st.bk.radieren){ bkZug = {radier:true}; bkRadiere(p); return; }
    bkZug = {f:st.bk.farbe, w:st.bk.dicke, p:[p]};
    var el = document.createElementNS(NS, "path");
    el.setAttribute("fill", "none"); el.setAttribute("stroke", BK_FARBEN[bkZug.f]); el.setAttribute("stroke-width", bkZug.w);
    el.setAttribute("stroke-linecap", "round"); el.setAttribute("stroke-linejoin", "round");
    document.getElementById("bk-striche").appendChild(el); bkZug.el = el;
  });
  document.addEventListener("pointermove", function(e){
    if (!bkZug) return;
    var p = bkPunkt(e);
    if (bkZug.radier){ bkRadiere(p); return; }
    bkZug.p.push(p);
    bkZug.el.setAttribute("d", bkZug.p.map(function(q, j){ return (j ? "L" : "M") + q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" "));
  });
  function bkEnde(){
    if (!bkZug) return;
    if (!bkZug.radier && bkZug.p.length > 1){ st.bk.striche.push({f:bkZug.f, w:bkZug.w, p:bkZug.p, v:st.bk.ansicht || "vorne"}); bkSpeichern(); render(); }
    else if (!bkZug.radier && bkZug.el) bkZug.el.remove();
    else if (bkZug.radier) render();
    bkZug = null;
  }
  document.addEventListener("pointerup", bkEnde);
  document.addEventListener("pointercancel", bkEnde);

  st.bk = Object.assign({}, BK_START, bkLaden() || {});
  render();
})();
</script>
</body>
</html>
