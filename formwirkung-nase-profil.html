<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beratung &amp; Formwirkung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Beratung & Formwirkung – Stil der Lernapp (vgl. zwischenpruefung.html) */
:root{
  --bg:#F5F3F7;--surface:#FFFFFF;--surface-2:#FAF8FC;--ink:#231B2E;--muted:#61586E;--line:#DDD6E6;
  --accent:#6D2E7F;--accent-ink:#FFFFFF;--accent-soft:#F1E4F6;--accent-hover:#5A2469;
  --good:#2F7D55;--good-soft:#E3F2EA;--bad:#B3362D;--bad-soft:#FBE6E3;
  --g-kopf:#E7E7EA;--g-kontur:#8C8C94;--g-haar:#8A8A92;--g-haar-kontur:#4C4C53;--g-hilfe:#A6A6AE;--g-flaeche:#EDEDF0;
  --shadow:0 1px 2px rgba(35,27,46,.05),0 6px 18px -6px rgba(35,27,46,.10);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;--r-s:10px;
  --t-xs:.8125rem;--t-s:.9375rem;--t-m:1.0625rem;--t-l:1.25rem;--t-xl:1.5rem;--t-2xl:1.875rem;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16121B;--surface:#201A28;--surface-2:#1B1622;--ink:#EEE8F4;--muted:#A99EB7;--line:#3A3045;
    --accent:#CFA2E0;--accent-ink:#1C1422;--accent-soft:#3A2A45;--accent-hover:#DDB9EA;
    --good:#6CC196;--good-soft:#1D3328;--bad:#EE8177;--bad-soft:#3E1F1C;
    --g-kopf:#3B3B41;--g-kontur:#8E8E97;--g-haar:#6E6E76;--g-haar-kontur:#B4B4BC;--g-hilfe:#74747C;--g-flaeche:#2C2C31;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16121B;--surface:#201A28;--surface-2:#1B1622;--ink:#EEE8F4;--muted:#A99EB7;--line:#3A3045;
  --accent:#CFA2E0;--accent-ink:#1C1422;--accent-soft:#3A2A45;--accent-hover:#DDB9EA;
  --good:#6CC196;--good-soft:#1D3328;--bad:#EE8177;--bad-soft:#3E1F1C;
  --g-kopf:#3B3B41;--g-kontur:#8E8E97;--g-haar:#6E6E76;--g-haar-kontur:#B4B4BC;--g-hilfe:#74747C;--g-flaeche:#2C2C31;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -8px rgba(0,0,0,.5);
}

/* Grundlagen und Browser-Oberflächen */
*{box-sizing:border-box}
html,body{margin:0}
html{scrollbar-color:var(--g-kontur) var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--t-m);line-height:1.6;caret-color:var(--accent);accent-color:var(--accent)}
::selection{background:var(--accent-soft);color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent);text-underline-offset:.2em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:var(--t-2xl);font-weight:800}
h2{font-size:var(--t-xl);font-weight:700}
h3{font-size:var(--t-l);font-weight:700}
p{margin:0;max-width:66ch}
ul,ol{margin:0}
strong{font-weight:700}

/* App-Leiste */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.appbar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:var(--t-l);letter-spacing:-.01em}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:var(--t-s);padding:7px 16px;border-radius:999px;cursor:pointer;min-height:36px;transition:background-color .18s var(--ease),color .18s var(--ease)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

/* Seitenrahmen */
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
.screen{display:flex;flex-direction:column;gap:16px}
@media (prefers-reduced-motion: no-preference){
  .screen{animation:rein .26s var(--ease)}
  @keyframes rein{from{opacity:.75;transform:translateY(8px)}to{opacity:1;transform:none}}
}
.pagehead{display:flex;flex-direction:column;gap:6px}
.pagehead .meta{color:var(--muted);font-size:var(--t-s)}
.tag{display:inline-block;font-size:var(--t-xs);font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px;vertical-align:middle}

/* Lernschritte */
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0;font-variant-numeric:tabular-nums}
.steps li{font-size:var(--t-xs);font-weight:700;padding:4px 10px;border-radius:999px;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.steps li.done{color:var(--accent);border-color:transparent;background:var(--accent-soft)}
.steps li.now{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}

/* Flächen */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.text{gap:12px}
.text ul,.text ol{padding-left:1.25em;display:flex;flex-direction:column;gap:6px}
.text li::marker{color:var(--accent)}
.note{font-size:var(--t-s);color:var(--muted)}
svg text{font-family:var(--f-body)}
.fig svg{display:block;width:100%;max-width:460px;height:auto;margin:0 auto}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair figure{margin:0;display:flex;flex-direction:column;gap:4px;text-align:center}
.pair figcaption{font-size:var(--t-s);font-weight:700;color:var(--muted)}

/* Bedienelemente */
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-s);padding:10px 16px;font:inherit;font-weight:700;font-size:var(--t-s);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px;transition:background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),transform .1s}
.btn:hover{border-color:var(--accent);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.btn svg{width:18px;height:18px;flex:none}
.nav{display:flex;justify-content:space-between;gap:10px}

/* Rückmeldungen */
.callout{border:1px solid var(--line);background:var(--surface-2);padding:12px 14px;border-radius:var(--r-s);display:flex;flex-direction:column;gap:4px}
.callout.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.callout.good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.callout.accent{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.answers{display:flex;flex-direction:column;gap:8px}
.answers .btn{justify-content:flex-start;text-align:left;font-weight:400;font-size:var(--t-m)}
.answers .btn.right,.imgchoice .btn.right{background:var(--good-soft);border-color:var(--good)}
.answers .btn.wrong,.imgchoice .btn.wrong{background:var(--bad-soft);border-color:var(--bad)}
.imgchoice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgchoice .btn{flex-direction:column;padding:8px}

/* Winkel-Labor */
.range{display:flex;flex-direction:column;gap:6px}
.range label{font-weight:700}
.range input{width:100%;min-height:32px}
.meter{display:flex;flex-direction:column;gap:4px}
.meter-bar{position:relative;height:12px;border-radius:999px;background:linear-gradient(90deg,var(--g-flaeche),var(--accent-soft));border:1px solid var(--line)}
.meter-bar span{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);transform:translate(-50%,-50%);transition:left .2s var(--ease)}
.meter-lbl{display:flex;justify-content:space-between;font-size:var(--t-xs);color:var(--muted)}
.merksatz{font-family:var(--f-display);font-size:var(--t-xl);font-weight:800;line-height:1.3;text-align:center;text-wrap:balance;color:var(--accent);padding:8px 0}

/* Wissen: Kapitelliste */
.kapitel-liste{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.kapitel-liste li+li{border-top:1px solid var(--line)}
.kapitel-liste button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:12px;width:100%;padding:14px 16px;cursor:pointer;transition:background-color .16s var(--ease)}
.kapitel-liste button:hover{background:var(--surface-2)}
.kapitel-liste button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.kapitel-liste .nr{font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:var(--t-l);font-variant-numeric:tabular-nums}
.kapitel-liste .tt{font-weight:700;display:block}
.kapitel-liste .ks{display:block;color:var(--muted);font-size:var(--t-s);line-height:1.45}
.kapitel-liste svg{width:18px;height:18px;color:var(--muted)}

/* Wissen: Kapitelseite */
.lesen{display:flex;flex-direction:column;gap:14px}
.lesen h3{margin-top:10px}
.lesen .lead{font-size:var(--t-l);line-height:1.5;color:var(--ink)}
.lesen blockquote{margin:0;padding:4px 0 4px 16px;border-left:1px solid var(--line);font-family:var(--f-display);font-size:var(--t-l);font-weight:500;line-height:1.4}
.lesen blockquote cite{display:block;font-family:var(--f-body);font-style:normal;font-size:var(--t-s);color:var(--muted);margin-top:4px}
.lesen dl{margin:0;display:grid;grid-template-columns:minmax(7.5em,max-content) 1fr;gap:8px 16px}
.lesen dt{font-weight:700}
.lesen dd{margin:0}
@media (max-width:520px){.lesen dl{grid-template-columns:1fr;gap:2px}.lesen dd{margin-bottom:8px}}
.ablauf{list-style:none;padding:0 !important;counter-reset:s;display:flex;flex-direction:column;gap:0 !important}
.ablauf>li{counter-increment:s;display:grid;grid-template-columns:2.4em 1fr;column-gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ablauf>li:first-child{border-top:0;padding-top:0}
.ablauf>li::before{content:counter(s);font-family:var(--f-display);font-weight:800;font-size:var(--t-xl);color:var(--accent);line-height:1.1;font-variant-numeric:tabular-nums}
.ablauf>li>div{display:flex;flex-direction:column;gap:6px}
.ablauf h3{margin:0;font-size:var(--t-m)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.harmonie{list-style:none;padding:0 !important;margin:0;display:flex;flex-direction:column;gap:0 !important}
.harmonie li{display:grid;grid-template-columns:40px 1fr;column-gap:14px;row-gap:6px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.harmonie li:first-child{border-top:0}
.harmonie li svg{width:40px;height:40px;grid-row:span 2}
.harmonie .zonen{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--t-s);color:var(--muted)}
.tabelle{overflow-x:auto}
.tabelle table{border-collapse:collapse;width:100%;min-width:480px;font-size:var(--t-s)}
.tabelle th,.tabelle td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tabelle th{font-size:var(--t-xs);color:var(--muted);font-weight:700}
.tabelle td svg{width:34px;height:34px;display:block}
.hell,.dunkel{display:inline-block;font-weight:700;font-size:var(--t-xs);padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.hell{background:#F4EEDF;color:#3B2F1C}
.dunkel{background:#3A2C22;color:#F4EEDF;border-color:#3A2C22}
.quelle{font-size:var(--t-xs);color:var(--muted)}
.grafik{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:12px}
.grafik svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto}
.drei{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.drei figure{margin:0;text-align:center;display:flex;flex-direction:column;gap:4px}
.drei figcaption{font-size:var(--t-xs);line-height:1.35;color:var(--muted)}
.drei figcaption strong{color:var(--ink);font-size:var(--t-s)}
</style>
</head>
<body>
<header class="appbar"><div class="appbar-in" id="bar"></div></header>
<main class="wrap" id="app"></main>
<script>
(function(){
  // ---------- Lehrgrafik (SVG) ----------
  // Stil wie Fach-Skizze: Kopf als Linienzeichnung, Kopfhaut fein gestrichelt,
  // Haarform als kräftig gestrichelte Umrisslinie, keine Füllungen.
  // Ebenen: kopf (fix) · haar (je Zustand) · nase (fix, obenauf) · Einblendungen
  var NASE = "M293,227 C306,246 322,266 340,282 C350,290 351,300 342,304 C332,307 318,304 309,307";
  var GESICHT = "M296,132 C299,142 301,152 301,160 C304,182 302,198 299,208 C301,214 297,221 293,227 " +
    NASE.slice(NASE.indexOf("C")) +
    " C313,313 315,318 312,322 C309,324 307,326 306,327 C310,330 311,336 307,340 C303,344 300,346 301,352 C303,362 306,374 300,386 C292,396 272,396 252,394 C244,396 238,404 238,434";
  var NACKEN = "M150,372 C151,392 152,414 152,438";
  var KOPFHAUT = "M150,372 L142,352 C118,328 92,298 84,262 C76,226 76,172 98,130 C118,94 162,72 214,74 C258,76 290,104 296,132";
  var ANSATZ = "M296,132 C284,160 270,190 262,200 L258,226 C246,222 232,208 214,210 C200,206 184,212 180,228 C176,260 168,320 150,372";
  var ANSATZ_REV = " C168,320 176,260 180,228 C184,212 200,206 214,210 C232,208 246,222 258,226 L262,200 C270,190 284,160 296,132 Z";
  var OHR = "M188,222 C205,214 217,230 213,252 C210,272 205,290 195,297 C189,301 184,296 186,289" +
    " M192,232 C203,229 208,241 204,256 C202,264 197,266 195,262";
  var AUGE = '<path d="M246,207 Q262,199 278,204" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>' +
    '<path d="M254,227 Q263,220 273,226 Q263,232 254,227 Z" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>' +
    '<circle cx="265" cy="226.5" r="2.4" fill="var(--ink)"/>' +
    '<path d="M306,327 L299,328" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>';
  var NASENSPITZE = [348, 294];
  var OHRLINIE = 196;

  // Haarform: Außenlinie vom Stirnansatz bis zum Nacken; back = hinterster Punkt auf Nasenhöhe
  var HAAR = {
    A:     {o:"M296,132 C292,92 256,66 206,66 C150,66 102,88 86,128 C68,170 68,226 76,264 C84,300 104,330 132,356 L150,372", back:81},
    M:     {o:"M296,132 C293,88 254,58 199,57 C136,56 82,85 63,136 C47,183 45,237 54,274 C63,307 94,332 132,355 L150,372", back:55},
    B:     {o:"M296,132 C294,84 252,50 192,48 C122,46 62,82 40,144 C26,196 22,248 32,284 C42,314 84,336 132,354 L150,372", back:32},
    tief:  {o:"M296,132 C292,92 256,66 206,66 C150,66 102,88 86,128 C68,170 68,226 72,270 C70,330 60,384 96,400 C120,408 140,392 150,372", back:72},
    hoch:  {o:"M296,132 C300,64 248,24 182,24 C116,24 72,66 66,132 C62,180 66,230 74,266 C84,304 104,330 132,356 L150,372", back:77},
    flach: {o:"M296,132 C292,92 256,66 206,66 C150,66 102,88 86,128 C120,150 170,196 214,210", back:84, kurz:true}
  };
  var SPITZE = "M296,128 C316,136 338,152 354,176 C334,176 316,180 302,190";
  var uid = 0;

  function haarFlaeche(H){
    return H.kurz ? H.o + " C232,208 246,222 258,226 L262,200 C270,190 284,160 296,132 Z" : H.o + ANSATZ_REV;
  }

  function txt(x, y, t, o){
    o = o || {};
    return '<text x="' + x + '" y="' + y + '" font-size="' + (o.size || 15) + '" font-weight="700"' +
      (o.anchor ? ' text-anchor="' + o.anchor + '"' : '') +
      ' fill="' + (o.fill || 'var(--ink)') + '" stroke="var(--surface)" stroke-width="4" paint-order="stroke">' + t + '</text>';
  }

  function fig(o){
    o = o || {};
    var H = HAAR[o.hair || "A"], id = ++uid, flaeche = haarFlaeche(H);
    var h = o.ohr ? 515 : 470;
    var s = '<svg viewBox="0 20 496 ' + h + '" role="img" aria-label="' + (o.label || "Profil") + '">';

    // schnittzonen (unter den Linien)
    if (o.zonen){
      s += '<clipPath id="z' + id + '"><path d="' + flaeche + '"/></clipPath>';
      s += '<g class="zonen"><g clip-path="url(#z' + id + ')">' +
        '<rect x="0" y="0" width="496" height="500" fill="var(--g-flaeche)"/>' +
        '<rect x="0" y="180" width="' + OHRLINIE + '" height="125" fill="var(--accent)" fill-opacity=".22"/>' +
        '<path d="M0,180 H320 M0,305 H' + OHRLINIE + ' M' + OHRLINIE + ',150 V420" stroke="var(--g-kontur)" stroke-width="1.4" fill="none"/>' +
        '</g></g>';
    }

    // kopf (fix): Kopfhaut fein gestrichelt, Gesicht/Nacken/Ohr als Linie
    s += '<g class="kopf" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="' + KOPFHAUT + '" stroke="' + (o.schaedel ? 'var(--ink)' : 'var(--g-kontur)') + '" stroke-width="' + (o.schaedel ? 2 : 1.5) + '" stroke-dasharray="3 4"/>' +
      '<path d="' + ANSATZ + '" stroke="var(--g-kontur)" stroke-width="1.5" stroke-dasharray="3 4"/>' +
      '<path d="' + GESICHT + '" stroke="var(--ink)" stroke-width="2.4"/>' +
      '<path d="' + NACKEN + '" stroke="var(--ink)" stroke-width="2.4"/>' +
      '<path d="' + OHR + '" stroke="var(--ink)" stroke-width="2.2"/>' +
      '</g>' + AUGE;

    // haar (veränderbar): kräftig gestrichelte Außenform
    s += '<g class="haar" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-dasharray="10 6" stroke-linecap="round">' +
      '<path d="' + H.o + '"/>' + (o.spitze ? '<path d="' + SPITZE + '"/>' : '') + '</g>';

    // nase (fix, immer obenauf)
    s += '<g class="nase"><path d="' + NASE + '" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>';

    if (o.zonen){
      s += '<g class="zonen-text">' +
        '<circle cx="84" cy="262" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>' +
        txt(150, 120, "Oberkopf", {anchor:"middle", size:14}) +
        txt(118, 232, "Hinterkopf", {anchor:"middle", size:14}) +
        txt(96, 280, "HHB", {size:13, fill:"var(--accent)"}) +
        txt(150, 336, "Nacken", {anchor:"middle", size:14}) +
        txt(214, 172, "Vorderpartie", {size:14}) + '</g>';
    }

    // hilfslinie + balance
    if (o.ohr){
      var xb = H.back, nx = NASENSPITZE[0], ny = NASENSPITZE[1];
      s += '<g class="hilfslinie"><line x1="' + OHRLINIE + '" y1="48" x2="' + OHRLINIE + '" y2="486" stroke="var(--g-hilfe)" stroke-width="1.6" stroke-dasharray="7 6"/>' +
        txt(OHRLINIE - 8, 40, "hinten", {anchor:"end", size:14, fill:"var(--muted)"}) +
        txt(OHRLINIE + 8, 40, "vorne", {size:14, fill:"var(--muted)"}) + '</g>';
      s += '<g class="balance">' +

  // Haarform-Außenlinie als Punktliste (Start + 5 Bézier-Segmente), je Winkel interpoliert:

      '<li><div><h3>Reaktive Gestik</h3><p>Du frisierst der Kundin die Haare in verschiedene Richtungen und fragst, wie sie sich bei jeder Richtung fühlt. Zum Beispiel: „Wie fühlen Sie sich, wenn ich Ihnen die Haare nach vorne frisiere?“</p></div></li>' +
      '<li><div><h3>Bestätigen</h3><p>Wiederholen, was die Kundin gesagt hat.</p></div></li>' +
      '<li><div><h3>Vorschläge machen</h3><p>Beraten heißt nicht, ihr zu sagen, wie sie ihre Frisur tragen soll. Beraten heißt, ihr zu helfen, ihren Stil zu finden.</p>' +
        '<p><strong>Drei Möglichkeiten anbieten:</strong> „Um diese Frisur zu erstellen, haben wir die Möglichkeit mit …“</p>' +
        '<ul><li>Schnitt und Farbe</li><li>Schnitt und Umformung</li><li>Schnitt und Stylingprodukte</li></ul>' +
        '<p>„Welche Art ist Ihnen am liebsten?“</p></div></li>' +
      '</ol>' +
      '<div class="callout accent"><h3>Ergebnis</h3><p>Die Kundin hat selbst entschieden. Sie kauft ein Ergebnis von uns.</p></div>'; }},

    {t:"Beratung mit Herz", s:"Seite 3", k:"Kommunikation, Kompetenz, Beratung. Welcher Baum bist du?", html: function(){ return '' +
      '<blockquote>„Um unersetzlich zu sein, muss man immer anders sein.“</blockquote>' +
      '<p>Bereit für deine Zukunft. Nimm es in die Hand. Wage es, dich neu zu erfinden, verlasse die Komfortzone und werde Wegbereiter für andere.</p>' +
      '<blockquote>„Wahre Schönheit und Weiblichkeit sind alterslos und nicht künstlich herstellbar.“<cite>Marilyn Monroe</cite></blockquote>' +
      '<h3>Die wichtigsten Gesichtspunkte einer Beratung</h3>' +
      '<dl><dt>Kommunikation</dt><dd>Austausch und Übertragung von Informationen</dd>' +
      '<dt>Kompetenz</dt><dd>Fähigkeit und Fertigkeit, eine Situation zu lösen</dd>' +
      '<dt>Beratung</dt><dd>Ein strukturiertes Gespräch, eine Kommunikationsform</dd></dl>' +
      '<h3>Kommunikation</h3>' +
      '<dl><dt>Zuhören</dt><dd>Warum hören wir oft nicht gut zu?</dd>' +
      '<dt>Beobachten</dt><dd>Was trägt die Kundin an Kleidung? Welche Formen erkennen wir in Kleidung und Frisur? Welche Farben zeichnen die Person aus?</dd>' +
      '<dt>Körpersprache</dt><dd>Gestik und Mimik, Gehweise</dd>' +
      '<dt>Sprachwahl</dt><dd>Neue Worte wählen. Die Wortwahl der Kundin erkennen und aufnehmen. „Weniger reden ist oft mehr.“</dd>' +
      '<dt>Emotionen</dt><dd>Die Emotionen der Gäste wahrnehmen.</dd></dl>' +
      '<h3>Welcher Baum bist du?</h3>' +
      '<dl><dt>Eiche</dt><dd>Perfektionist durch und durch. Kontrolliert den Sitzplatz, bevor sie sich hinsetzt, räumt sofort alles weg. Bei der Kleidung muss alles zusammenpassen und perfekt sitzen.</dd>' +
      '<dt>Olivenbaum</dt><dd>Sehr gemütlich, rutscht langsam vom Sessel. Die Ruhe in Person, macht sich keinen Stress.</dd>' +
      '<dt>Weide</dt><dd>Sehr kommunikativ, macht alles gleichzeitig und schnell, ständig in Bewegung. Trägt eher weite Kleidung.</dd></dl>' +
      '<h3>Drei Gesichtsformen, drei Energien</h3>' +
      '<div class="grafik"><div class="drei">' +
        '<figure><div style="max-width:64px;margin:0 auto">' + energie("+") + '</div><figcaption><strong>Steigend</strong><br>steigende Gesichtsform, steigende Energie</figcaption></figure>' +
        '<figure><div style="max-width:64px;margin:0 auto">' + energie("-") + '</div><figcaption><strong>Fallend</strong><br>fallende Gesichtsform, fallende Energie</figcaption></figure>' +
        '<figure><div style="max-width:64px;margin:0 auto">' + energie("=") + '</div><figcaption><strong>Harmonisch</strong><br>harmonische Gesichtsform, harmonische Energie</figcaption></figure>' +
      '</div></div>' +
      '<div class="callout accent"><p><strong>Beobachten:</strong> Jedes Gesicht ist einzigartig. Um eine Frisur zu gestalten, muss man die Form erkennen.</p></div>'; }},

    {t:"Fundament, Mauern und dann das Dach", s:"Seite 4", k:"Das Gesicht als Haus. Harmonie, Charakter und was eine Frisur im Gesicht bewirkt.", html: function(){ return '' +
      '<div class="grafik">' + haus() + '</div>' +
      '<dl><dt>Fundament</dt><dd>Von Mama und Papa (Kinn)</dd><dt>Mauern</dt><dd>Gesichtsform</dd><dt>Dach</dt><dd>Frisur bzw. Volumen</dd><dt>Fenster</dt><dd>Augen</dd></dl>' +
      '<h3>Kunden wünschen sich</h3><ul><li>Ideen</li><li>Inspirationen</li><li>ein Neues-Ich-Gefühl</li></ul>' +
      '<h3>Dein Profit</h3><ul><li>Dein persönliches Image</li><li>Kunden werden zu Fans</li><li>Du hebst dich von der breiten Masse ab</li></ul>' +
      '<h3>Harmonie und Charakter</h3>' +
      '<p><strong>Harmonie</strong> ist eine Übereinstimmung von Farben (bis 3 Töne Unterschied) und die Einheit einer Vielfalt. Kunden empfinden sie als angenehm.</p>' +
      '<p><strong>Charakter</strong> ist oft die Dominanz einer Farbe in der Persönlichkeit. Der Kunde hat die Eigenschaften eines Individuums. Charaktertypen zeichnen sich oft durch Farbunterschiede aus.</p>' +
      '<h3>Einflüsse</h3><ul>' +
      '<li>Die Kontur hat Einfluss auf das innere Gesicht, sie wirkt auf das Gesicht.</li>' +
      '<li>Das Mittelteil hat Einfluss auf das Volumen.</li>' +
      '<li>Kontur dunkler: Gesicht heller.</li><li>Kontur heller: Gesicht dunkler.</li>' +
      '<li>Bei einer Blondine sind die Haare im Vordergrund, bei einer Brünetten das Gesicht.</li>' +
      '<li>Ändert sich die Hautfarbe (Sommer), ändert sich auch die Wirkung der Haarfarbe.</li>' +
      '<li>Eckige Linien harmonieren mit weichen Linien.</li>' +
      '<li>Asymmetrie streckt das Gesicht.</li>' +
      '<li>Wenn du die Frisur bewegst, bewegst du etwas im Gesicht.</li>' +
      '<li>Von einem Apfelbaum fällt keine Birne.</li></ul>' +
      '<h3>Beratung mit Herz: Checkpoints</h3><ul>' +
      '<li>Beratung fängt bei dir an (Badezimmer).</li>' +
      '<li>Die Beratung des Kunden beginnt beim Reinkommen.</li>' +
      '<li>Wir frisieren Menschen, keine Haare.</li>' +
      '<li>Beratung und Technik ergeben das Ergebnis (Vertrauen schaffen).</li>' +
      '<li>Beratung heißt Gesicht lesen.</li>' +
      '<li>„Sie beraten ist nicht, für sie zu wählen, sondern ihren Stil zu finden.“</li>' +
      '<li>Jedes Gesicht ist einzigartig.</li></ul>'; }},

    {t:"Kunden locken, Fans suchen Leistung", s:"Seite 5", k:"Beratungsablauf, Pflegetyp oder Stylingtyp, die Sprache der Kunden.", html: function(){ return '' +
      '<h3>Beratungsablauf</h3><ul><li>Drei Haarfarben, die ihnen gefallen?</li><li>Drei Bilder aussuchen lassen (keine Frisuren) und fragen, was ihnen an den Bildern gefällt.</li></ul>' +
      '<h3>Beratung am Kunden</h3><ul><li>Wie finden Sie Ihre Haarstruktur?</li><li>Wie finden Sie Ihre Kopfhaut?</li></ul>' +
      '<p>Wir reden von <strong>Licht und Schatten</strong>, von <strong>Höhen und Tiefen</strong>.</p>' +
      '<h3>Feststellung: Wie greift sich der Kunde ins Haar?</h3>' +
      '<dl><dt>Pflegetyp</dt><dd>Greift sanft in die Haare, streichelt sie.</dd><dt>Stylingtyp</dt><dd>Greift kräftig ins Haar und versucht, Volumen hineinzubekommen.</dd></dl>' +
      '<h3>Aufklären, die Sprache der Kunden wählen, Bedürfnisse wiederholen</h3><ul>' +
      '<li>„Ich habe eine Lösung für dich!“</li>' +
      '<li>„Das sind die Produkte, die ich heute brauche, um deine Frisur gemeinsam zu erstellen.“</li>' +
      '<li>„Ich werde dieses Haarbad verwenden, weil du mehr Volumen am Ansatz haben möchtest …“</li>' +
      '<li>„Ich habe gesehen, dass du die Ansätze aus dem Gesicht haben möchtest. Da würde ich dir den Ansatzschaum von L’Oréal empfehlen.“</li>' +
      '<li>„Dieses Produkt kostet 27 €. Für deine Haarlänge kannst du 50-mal waschen.“</li></ul>' +
      '<p>Unser zweites Gehirn ist unser Bauch. Benutze dein zweites Gehirn!</p>' +
      '<dl><dt>Technik</dt><dd>Das, was du in deiner Ausbildung lernst.</dd><dt>Kreativität</dt><dd>Das, was man macht, was man noch nie gesehen hat.</dd><dt>Stil</dt><dd>Das, was du trägst. Dein Stil macht deine Persönlichkeit.</dd></dl>' +
      '<div class="callout accent"><p><strong>Welche Wirkung hat diese Frisur in deinem Gesicht?</strong></p><p><strong>Was passiert in deinem Gesicht, wenn du das machst?</strong></p></div>' +
      '<p class="note">Zukunft: menschliche Beziehung und Digitalisierung.</p>'; }},

    {t:"Gesichtsmerkmale ausgleichen", s:"Seite 6", k:"Nase, Augen, Ohren, Lippe und Gesichtsformen. Mit welcher Frisur man sie ausgleicht.", html: function(){ return '' +
      '<dl>' +
      '<dt>Doppelkinn</dt><dd>Mehr Volumen am Oberkopf.</dd>' +
      '<dt>Große Nase (Seitenprofil)</dt><dd>Mehr Hinterkopf betonen.<br><button class="btn" type="button" data-act="goPilot" style="margin-top:8px">Im Pilotfall ausprobieren ' + ICON_WEITER + '</button></dd>' +
      '<dt>Markante Nase</dt><dd>Kann durch eine Frisur mit seitlichem Pony oder voluminösem Haar am Oberkopf kaschiert werden. Auch eine lockige oder wellige Frisur lenkt die Aufmerksamkeit von der Nase ab.</dd>' +
      '<dt>Hängendes Auge</dt><dd>Eine Frisur mit seitlichem Pony oder seitlichem Scheitel. Dadurch wird das Auge optisch angehoben und der Blick auf das andere Auge gelenkt.</dd>' +
      '<dt>Abstehende Ohren</dt><dd>Lange Haare, die die Ohren bedecken, oder eine Frisur mit seitlichem Scheitel. Auch ein seitlich gesteckter Zopf oder Volumen am Oberkopf lenkt die Aufmerksamkeit von den Ohren ab.</dd>' +
      '<dt>Hängende Lippe</dt><dd>Eine Frisur mit seitlichem Pony oder seitlichem Scheitel. Das Haar soll das Gesicht umrahmen und von der Lippe ablenken. Auch lockiges oder welliges Haar kann das Aussehen der Lippe verändern.</dd>' +
      '<dt>Weiches (rundes) Gesicht</dt><dd>Lange, wellige oder gestufte Haare. Auch ein seitlicher Pony oder ein asymmetrischer Bob lässt das Gesicht schmaler erscheinen. Dunklere Haarfarben betonen die Konturen des Gesichts.</dd>' +
      '<dt>Harmonisches (ovales) Gesicht</dt><dd>Kann nahezu jede Frisur tragen. Eine lange, glatte Frisur oder ein Pixie-Schnitt betont die natürliche Form. Auch verschiedene Haarfarben bringen das ovale Gesicht gut zur Geltung.</dd>' +
      '<dt>Abfallendes (dreieckiges) Gesicht</dt><dd>Schmale Stirn, breiterer Kiefer. Ausgleich durch viel Volumen am Oberkopf. Ein seitlicher Pony oder lange, wellige Haare lassen das Gesicht weicher und gleichmäßiger erscheinen.</dd>' +
      '<dt>Aufsteigendes (dreieckiges) Gesicht</dt><dd>Breitere Stirn, schmalerer Kiefer. Kaschieren mit seitlichem Pony oder seitlichem Scheitel. Lange Haare, die das Gesicht umrahmen, gleichen optisch aus. Eine warme Haarfarbe lässt das Gesicht weicher wirken.</dd>' +
      '</dl>'; }},

    {t:"Haarfarbe und Wirkung", s:"Seite 6–7", k:"Wie die Haarfarbe Gesichtsform, Teint und Volumen verändert.", html: function(){ return '' +
      '<p class="lead">Die Haarfarbe kann das Gesicht und das Volumen auf verschiedene Weisen beeinflussen.</p>' +
      '<dl>' +
      '<dt>Gesichtsform</dt><dd>Die richtige Haarfarbe kann die Gesichtsform optisch verändern und bestimmte Merkmale betonen oder kaschieren. Eine dunkle Haarfarbe lässt ein rundes Gesicht schlanker wirken, helle Strähnen schaffen zusätzliche Dimension und Kontur.</dd>' +
      '<dt>Gesichtsfarbe</dt><dd>Die richtige Haarfarbe kann den Teint betonen oder verbessern. Warme Töne wie Kastanienbraun oder Honigblond bringen einen warmen Teint zum Strahlen. Kühle Töne wie Platinblond oder Aschbraun kommen bei einem kühlen Teint besser zur Geltung.</dd>' +
      '<dt>Volumen</dt><dd>Dunkle Haarfarben reflektieren weniger Licht und lassen das Haar oft dünner erscheinen. Helle Haarfarben reflektieren das Licht und sorgen für mehr Glanz und Fülle. Highlights und Lowlights geben dem Haar mehr Tiefe und Volumen.</dd>' +
      '</dl>' +
      '<div class="callout accent"><p><strong>Insgesamt hat die Haarfarbe einen großen Einfluss auf das Gesicht und das Volumen der Haare.</strong> Sie kann das Erscheinungsbild verbessern und individuelle Merkmale betonen.</p></div>' +
      '<h3>Allgemeines</h3><ul>' +
      '<li>Sprich mit mir und ich zeig dir deine Frisur.</li>' +
      '<li>Wir frisieren den Menschen, nicht die Haare.</li>' +
      '<li>Licht und Schatten im Haar ergeben Volumen oder Gewicht.</li>' +
      '<li>Alles bis zum Busen hat eine Wirkung auf das Gesicht.</li>' +
      '<li>Innendekoration deines Gesichts.</li>' +
      '<li>Das innere Gesicht hat mehr Emotionen.</li>' +
      '<li>Das äußere Gesicht entscheidet die Energien im Gesicht: steigend, fallend oder harmonisch.</li></ul>' +
      '<h3>Der Kunde muss einkaufen, nicht du verkaufen!</h3>' +
      '<p>Warum geht der Verkauf nicht gut? Wegen dem <strong>Preis</strong> oder der <strong>Kommunikation</strong>.</p>' +
      '<p>Zukunft: menschliche Beziehung und Digitalisierung.</p>' +
      '<p class="merksatz">T.U.N. = Erfolg</p>'; }},

    {t:"Die 7 Grundsymbole", s:"Seite 8", k:"Sieben Gesichtsformen, sieben Farben, drei Energien.", html: function(){ return '' +
      '<p class="lead">Sieben Gesichtsformen und sieben Farben lassen sich drei Energien zuordnen: fallend, harmonisch und steigend.</p>' +
      '<div class="grafik">' + grundsymbole() + '</div>' +
      '<dl><dt>Fallend</dt><dd>Quadrat, Rechteck breit, Dreieck mit Spitze oben</dd><dt>Harmonisch</dt><dd>Raute</dd><dt>Steigend</dt><dd>Kreis, Rechteck hoch, Dreieck mit Spitze unten</dd></dl>' +
      '<p class="quelle">Nach: L’Oréal Professionnel, Die 7 Grundsymbole. Symbole nachgezeichnet.</p>'; }},

    {t:"Harmonie-Formen durch Farbe", s:"Seite 9", k:"Wo die Farbe hell oder dunkel gesetzt wird, damit eine Form optisch stärker wirkt.", html: function(){ return '' +
      '<p class="lead">Die Harmonie-Form wird durch Farbe optisch verstärkt. Die Übersicht zeigt, welcher Bereich hell und welcher dunkel gefärbt wird.</p>' +
      harmonieTabelle() +
      '<p class="note">Faustregel: Die Spitze einer Form wird dunkel, der breite Teil hell.</p>'; }},

    {t:"Tonhöhe und Profil", s:"Seite 10", k:"Tonhöhentabelle 2 bis 11 und was dunkle, mittlere und helle Töne im Profil bewirken.", html: function(){ return '' +
      '<p class="lead">Die Tonhöhentabelle der Coloration teilt die Tonhöhen 2 bis 11 in drei Gruppen. Jede Gruppe wirkt im Profil anders.</p>' +
      '<div class="grafik">' + tonskala() + '</div>' +
      '<p class="note">Die Mitte liegt zwischen 6 und 7. Die Bogenpfeile zeigen: 5 und 6 wirken schon zur dunklen Seite hin, 7 und 8 zur hellen.</p>' +
      '<div class="grafik"><div class="drei">' +
        '<figure>' + profilPfeile("dunkel") + '<figcaption><strong>2–4 dunkel</strong><br>Haar tritt zurück, Gesicht tritt hervor</figcaption></figure>' +
        '<figure>' + profilPfeile("mittel") + '<figcaption><strong>5–8 mittel</strong><br>streckt das Profil</figcaption></figure>' +
        '<figure>' + profilPfeile("hell") + '<figcaption><strong>9–11 hell</strong><br>Haar tritt hervor, Gesicht tritt zurück</figcaption></figure>' +
      '</div></div>' +
      '<p>Das passt zu Seite 4: Bei einer Blondine sind die Haare im Vordergrund, bei einer Brünetten das Gesicht.</p>' +
      '<p class="quelle">Nach: Visagisme Total Look, C. Juillard. Grafik nachgezeichnet.</p>'; }}
  ];

  function renderWissen(){
    if (st.kap < 0){
      return '<div class="screen"><div class="pagehead"><h1>Wissen aus der Beratung</h1>' +
        '<p class="meta">Die Inhalte aus deinem Unterrichtsmaterial, Seite 1 bis 10.</p></div>' +
        '<ol class="kapitel-liste">' + KAPITEL.map(function(k, i){
          return '<li><button type="button" data-act="kap" data-val="' + i + '"><span class="nr">' + (i + 1) + '</span>' +
            '<span><span class="tt">' + k.t + '</span><span class="ks">' + k.k + ' · ' + k.s + '</span></span>' + ICON_WEITER + '</button></li>';
        }).join("") + '</ol></div>';
    }
    var K = KAPITEL[st.kap], i = st.kap;
    return '<div class="screen"><div><button class="btn" type="button" data-act="kap" data-val="-1">' + ICON_ZURUECK + 'Alle Kapitel</button></div>' +
      '<div class="pagehead"><h1>' + K.t + '</h1><p class="meta">Kapitel ' + (i + 1) + ' von ' + KAPITEL.length + ' · ' + K.s + '</p></div>' +
      '<article class="card lesen">' + K.html() + '</article>' +
      '<div class="nav">' +
        '<button class="btn" type="button" data-act="kap" data-val="' + (i - 1) + '"' + (i === 0 ? ' disabled' : '') + '>' + ICON_ZURUECK + 'Zurück</button>' +
        (i < KAPITEL.length - 1 ? '<button class="btn primary" type="button" data-act="kap" data-val="' + (i + 1) + '">Nächstes Kapitel' + ICON_WEITER + '</button>'
                                : '<button class="btn primary" type="button" data-act="kap" data-val="-1">Alle Kapitel</button>') +
      '</div></div>';
  }

  // ---------- Inhalte (aus konzept/2d-tool-pilot-nase-im-profil.md) ----------
  var STEPS = ["Ausgangsform","Zielwirkung","Schnitt","Warum","Achten","Check","Merksatz"];

  var FEHLER = {
    tief:  {t:"Aufbau zu tief (im Nacken)", d:"Die Form wirkt schwer und hängend. Es entsteht kein Gegengewicht zur Nase.", fig:{hair:"tief"}},
    hoch:  {t:"Aufbau zu hoch (nur oben)", d:"Der Kopf wirkt nach oben verlängert. Die Nase bleibt im Profil dominant.", fig:{hair:"hoch"}},
    spitz: {t:"Spitze vorne", d:"Vorne entsteht eine zweite Spitze, zum Beispiel durch einen spitzen, nach vorne gerichteten Pony. Der Blick wird zusätzlich zur Nase gelenkt.", fig:{hair:"B", spitze:true}},
    flach: {t:"Hinten sehr kurz und flach", d:"Zum Beispiel ein hoher Undercut oder Haar streng nach hinten. Hinten fehlt jedes Gegengewicht, das Profil liegt ganz frei.", fig:{hair:"flach"}},
    gut:   {t:"So passt es", d:"Aufbau etwa am Hinterhauptbein, Nacken schmal, vorne ruhig.", fig:{hair:"B"}, ok:true}

  var FRAGEN = [
    {q:"Was passiert, wenn der Hinterkopf mehr Aufbau bekommt?",

  // ---------- Zustand ----------
  var st = {view:"pilot", kap:-1, screen:0, ohr:true, hair:"A", zonen:true, schaedel:false, winkel:0, fehler:"tief", q:0, picked:null, score:0};

  var SCREENS = [
    {step:-1, render:function(){
      return card('<div class="pair">' +
          '<figure>' + fig({hair:"A", label:"Vorher: flacher Hinterkopf"}) + '<figcaption>Vorher</figcaption></figure>' +
          '<figure>' + fig({hair:"B", label:"Nachher: Aufbau am Hinterkopf"}) + '<figcaption>Nachher</figcaption></figure>' +
        '</div>',
        '<h2>Worum es geht</h2>' +
        '<p>Manche Kundinnen und Kunden haben eine lange oder markante Nase. Die Nase können wir nicht verändern. Aber wir können verändern, wie sie im Verhältnis zum ganzen Kopf wirkt.</p>' +
        '<p>In diesem Beispiel siehst du, wie das im Profil funktioniert. Die Nase bleibt in jedem Bild gleich. Nur die Haarform ändert sich.</p>' +
        '<div class="callout accent"><p><strong>Aus dem Unterricht:</strong> Große Nase im Seitenprofil – mehr Hinterkopf betonen.</p></div>');
    }},
    {step:0, render:function(){
      return card(fig({hair:"A", ohr:st.ohr, label:"Ausgangsform: flacher Hinterkopf"}) +
        controls(toggle("ohr","Balance zeigen", st.ohr)),
        '<h2>Ausgangsform</h2>' +
        '<p>Schau dir das Profil an. Der Hinterkopf ist flach, das Haar liegt eng an.</p>' +

        '<p class="note">Die Balken unten zeigen es: Der Kopf ist vorne viel länger als hinten.</p>');
    }},
    {step:1, render:function(){
      return card(fig({hair:st.hair, ohr:st.ohr, label:{A:"Zustand A: flacher Hinterkopf", M:"Zwischenstufe: etwas Aufbau", B:"Zustand B: mehr Aufbau am Hinterkopf"}[st.hair]}) +
        controls(seg("hair",[["A","A · flach"],["M","Zwischenstufe"],["B","B · Aufbau"]], st.hair) + toggle("ohr","Balance", st.ohr)),
        '<h2>Zielwirkung</h2>' +
        '<p>Ziel ist ein Gleichgewicht zwischen vorne und hinten. Wenn der Hinterkopf mehr Rundung bekommt, entsteht ein Gegengewicht zur Nase.</p>' +
        '<p>Die Nase bleibt genau gleich. Sie wirkt aber nicht mehr so stark, weil der Kopf als Ganzes ausgeglichener aussieht.</p>' +
        '<p class="note">Schalte ein paar Mal zwischen A, Zwischenstufe und B um. Der Balken „vorne“ bleibt gleich lang, der Balken „hinten“ wächst. Die Nase ändert sich nicht.</p>');
    }},
    {step:2, render:function(){
      
      return card(fig({hair:"B", zonen:st.zonen, schaedel:st.schaedel, label:"Schnittzonen"}) +
        controls(toggle("zonen","Schnittzonen", st.zonen) + toggle("schaedel","Schädelform", st.schaedel)),
        '<h2>Mögliche Schnittentscheidung</h2>' +
        '<ul>' +
        '<li><strong>Hinterkopf:</strong> mit Graduation Aufbau schaffen. Die meiste Fülle sitzt ungefähr am Hinterhauptbein, etwa auf der Höhe, auf der vorne die Nase ist.</li>' +
        '<li><strong>Nacken:</strong> schmal und nah am Kopf. So wirkt der Aufbau darüber deutlicher.</li>' +
        '<li><strong>Oberkopf:</strong> leicht mitführen, damit die Form rund bleibt.</li>' +
        '<li><strong>Vorderpartie:</strong> weich, nicht spitz nach vorne.</li>' +
        '</ul>' +
        '<p>Das ist eine Möglichkeit, nicht die einzige. Entscheidend ist die Wirkung: hinten Aufbau, vorne Ruhe.</p>');
    }},
    {step:2, render:function(){
      return card(
        '<div id="winkelFig">' + winkelFig(st.winkel) + '</div>' +
        '<div class="range"><label for="winkel">Erhebungswinkel am Hinterkopf</label>' +
        '<input type="range" id="winkel" min="0" max="90" step="5" value="' + st.winkel + '"></div>' +
        controls(seg("winkel",[["0","0°"],["20","20°"],["45","45°"],["70","70°"],["90","90°"]], String(st.winkel))),
        '<h2>Ausprobieren: der Winkel macht die Wirkung</h2>' +
        '<p>Beim Graduieren hebst du die Strähnen am Hinterkopf in einem Winkel an. Der Winkel bestimmt, wo das Gewicht entsteht. Zieh den Regler und beobachte die Gewichtslinie, die Balken und die Wirkung auf die Nase.</p>' +
        '<div id="winkelText" aria-live="polite">' + winkelText(st.winkel) + '</div>');
    }},
    {step:3, render:function(){
      return card('<div class="pair">' +
          '<figure>' + fig({hair:"A", blick:"A", label:"Vorher: Blick bleibt an der Nase"}) + '<figcaption>Vorher</figcaption></figure>' +
          '<figure>' + fig({hair:"B", blick:"B", label:"Nachher: Blick verteilt sich"}) + '<figcaption>Nachher</figcaption></figure>' +
        '</div>',
        '<h2>Warum es wirkt</h2>' +
        '<p>Unser Auge vergleicht immer. Es schaut nicht nur auf die Nase, sondern auf den ganzen Umriss des Kopfes.</p>' +
        '<p>Ist hinten wenig Form, bleibt der Blick vorne an der Nase hängen. Ist hinten ein Gegengewicht, verteilt sich der Blick über den ganzen Kopf. Die Nase ist dann ein Teil des Gesamtbildes und nicht mehr der Mittelpunkt.</p>');
    }},
    {step:4, render:function(){
      var f = FEHLER[st.fehler];
      return card(fig(Object.assign({label:f.t}, f.fig)) +
        controls(seg("fehler",[["tief","Zu tief"],["hoch","Zu hoch"],["spitz","Spitz vorne"],["flach","Hinten flach"],["gut","So passt es"]], st.fehler)) +
        '<div class="callout ' + (f.ok ? 'good' : 'bad') + '"><strong>' + f.t + '</strong><p>' + f.d + '</p></div>',
        '<h2>Worauf achten: Fehlerbilder</h2>' +
        '<p>Aufbau am Hinterkopf hilft nur, wenn er an der richtigen Stelle sitzt. Schau dir die typischen Fehler nacheinander an.</p>');
    }},
    {step:4, render:function(){
      return card(fig({hair:"B", label:"Zielform"}),
        '<h2>Worauf achten: vor dem Schneiden prüfen</h2>' +
        '<ul>' +
        '<li><strong>Haarstruktur und Haarmenge:</strong> Hält feines Haar den Aufbau?</li>' +
        '<li><strong>Wirbel am Hinterkopf:</strong> Wohin fällt das Haar von selbst?</li>' +
        '<li><strong>Styling zu Hause:</strong> Kann die Kundin oder der Kunde die Form selbst nachstylen?</li>' +
        '<li><strong>Alle Ansichten:</strong> Die Form muss auch von vorne und von hinten stimmig sein.</li>' +
        '<li><strong>Wunsch der Kundin oder des Kunden:</strong> Nicht jede Person möchte ihre Nase ausgleichen. Frag nach, bevor du darauf eingehst, und sprich respektvoll über das Gesicht.</li>' +
        '</ul>');
    }},
    {step:5, render:renderCheck},
    {step:6, render:function(){
      return card('<div class="pair">' +
          '<figure>' + fig({hair:"A", label:"Vorher"}) + '<figcaption>Vorher</figcaption></figure>' +
          '<figure>' + fig({hair:"B", label:"Nachher"}) + '<figcaption>Nachher</figcaption></figure>' +
        '</div>',
        '<h2>Merksatz</h2>' +
        '<p class="merksatz">Die Nase bleibt gleich, das Verhältnis ändert sich.<br>Hinten Aufbau, vorne Ruhe.</p>');
    }}
  ];

  function renderCheck(){
    if (st.q >= FRAGEN.length){
      return card('',
        '<h2>Verständnis-Check</h2>' +
        '<p><strong>' + st.score + ' von ' + FRAGEN.length + '</strong> Fragen beim ersten Versuch richtig.</p>' +
        '<div class="controls"><button class="btn" type="button" data-act="checkReset">Check wiederholen</button></div>');
    }
    var F = FRAGEN[st.q], done = st.picked !== null, html;
    function cls(i){ if(!done) return ""; if(i===F.r) return " right"; if(i===st.picked) return " wrong"; return ""; }
    if (F.bild){
      html = '<div class="imgchoice">' + F.a.map(function(t,i){
        return '<button class="btn' + cls(i) + '" type="button" data-act="pick" data-i="' + i + '"' + (done?' disabled':'') + '>' +
          fig({hair: i===0 ? "A" : "B", label:t}) + t + '</button>';
      }).join("") + '</div>';
    } else {
      html = '<div class="answers">' + F.a.map(function(t,i){
        return '<button class="btn' + cls(i) + '" type="button" data-act="pick" data-i="' + i + '"' + (done?' disabled':'') + '>' + t + '</button>';
      }).join("") + '</div>';
    }
    if (done){
      html += '<div class="callout ' + (st.picked===F.r ? 'good' : 'bad') + '"><p><strong>' + (st.picked===F.r ? "Richtig. " : "Nicht ganz. ") + '</strong>' + F.f + '</p></div>' +
        '<div class="controls"><button class="btn primary" type="button" data-act="nextQ">' + (st.q < FRAGEN.length-1 ? "Nächste Frage" : "Ergebnis zeigen") + '</button></div>';
    }
    return card('',
      '<h2>' + F.q + '</h2><p class="note">Frage ' + (st.q+1) + ' von ' + FRAGEN.length + '</p>' + html);
  }

  // ---------- Bausteine ----------
  function card(figHtml, textHtml){
    return (figHtml ? '<section class="card fig">' + figHtml + '</section>' : '') +
      '<section class="card text">' + textHtml + '</section>';
  }
  function controls(inner){ return '<div class="controls">' + inner + '</div>'; }
  function toggle(key, label, on){
    return '<button class="btn' + (on?' on':'') + '" type="button" aria-pressed="' + on + '" data-act="toggle" data-key="' + key + '">' + label + '</button>';
  }
  function seg(key, opts, val){
    return opts.map(function(o){
      var on = o[0]===val;
      return '<button class="btn' + (on?' on':'') + '" type="button" aria-pressed="' + on + '" data-act="set" data-key="' + key + '" data-val="' + o[0] + '">' + o[1] + '</button>';
    }).join("");
  }


  // ---------- App-Rahmen ----------
  function neuStart(){ return {view:st.view, kap:st.kap, screen:0, ohr:true, hair:"A", zonen:true, schaedel:false, winkel:0, fehler:"tief", q:0, picked:null, score:0}; }

  function renderPilot(){
    var S = SCREENS[st.screen];
    var steps = '<ol class="steps" aria-label="Lernschritte">' + STEPS.map(function(t,i){
      var c = i < S.step ? "done" : (i === S.step ? "now" : "");
      return '<li class="' + c + '"' + (i===S.step?' aria-current="step"':'') + '>' + t + '</li>';
    }).join("") + '</ol>';
    var last = st.screen === SCREENS.length-1;
    var nav = '<div class="nav">' +
      '<button class="btn" type="button" data-act="prev"' + (st.screen===0?' disabled':'') + '>' + ICON_ZURUECK + 'Zurück</button>' +
      (last ? '<button class="btn primary" type="button" data-act="restart">Von vorne</button>'
            : '<button class="btn primary" type="button" data-act="next">' + (st.screen===0 ? "Los geht’s" : "Weiter") + ICON_WEITER + '</button>') +
      '</div>';
    return '<div class="screen"><div class="pagehead"><h1>Lange Nase im Profil <span class="tag">Pilotfall V1</span></h1></div>' +
      steps + S.render() + nav + '</div>';
  }

  function render(){
    document.getElementById("bar").innerHTML =
      '<span class="brand">Beratung &amp; Formwirkung</span>' +
      '<nav class="tabs" aria-label="Bereiche">' +
        '<button type="button" data-act="view" data-val="pilot"' + (st.view==="pilot" ? ' aria-current="page"' : '') + '>Pilotfall</button>' +
        '<button type="button" data-act="view" data-val="wissen"' + (st.view==="wissen" ? ' aria-current="page"' : '') + '>Wissen</button>' +
      '</nav>';
    document.getElementById("app").innerHTML = st.view === "wissen" ? renderWissen() : renderPilot();
  }

  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
    var a = b.dataset.act, moved = false;
    if (a==="view"){ if (st.view !== b.dataset.val){ st.view = b.dataset.val; moved = true; } }
    if (a==="kap"){ st.kap = +b.dataset.val; moved = true; }
    if (a==="goPilot"){ st.view = "pilot"; st.screen = 0; moved = true; }
    if (a==="next"){ st.screen = Math.min(st.screen+1, SCREENS.length-1); moved = true; }
    if (a==="prev"){ st.screen = Math.max(st.screen-1, 0); moved = true; }
    if (a==="restart"){ st = neuStart(); moved = true; }
    if (a==="toggle"){ st[b.dataset.key] = !st[b.dataset.key]; }
    if (a==="set"){ st[b.dataset.key] = b.dataset.key === "winkel" ? +b.dataset.val : b.dataset.val; }
    if (a==="pick"){ st.picked = +b.dataset.i; if (st.picked === FRAGEN[st.q].r) st.score++; }
    if (a==="nextQ"){ st.q++; st.picked = null; }
    if (a==="checkReset"){ st.q = 0; st.picked = null; st.score = 0; }
    render();
    if (moved) window.scrollTo(0,0);
  });

  // Regler: nur Grafik und Text neu zeichnen, damit der Regler beim Ziehen bedienbar bleibt
  document.addEventListener("input", function(e){
    if (e.target.id !== "winkel") return;
    st.winkel = +e.target.value;
    document.getElementById("winkelFig").innerHTML = winkelFig(st.winkel);
    document.getElementById("winkelText").innerHTML = winkelText(st.winkel);
    document.querySelectorAll('[data-key="winkel"]').forEach(function(b){
      var on = +b.dataset.val === st.winkel; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
    });
  });

  render();
})();
</script>
</body>
</html>
