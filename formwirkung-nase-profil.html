<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formwirkung Nase im Profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* V1 Pilotfall „Lange Nase im Profil“ – Stil wie zwischenpruefung.html */
:root{
  --bg:#F5F3F7;--surface:#FFFFFF;--ink:#231B2E;--muted:#6B6278;--line:#DDD6E6;
  --accent:#6D2E7F;--accent-ink:#FFFFFF;--accent-soft:#F1E4F6;
  --good:#2F7D55;--good-soft:#E3F2EA;--bad:#B3362D;--bad-soft:#FBE6E3;
  --skin:#EFDCCD;--skin-line:#B8917A;--face-line:#5E4436;--lip:#D9A89A;--hair:#6B4631;--hair-line:#3F2719;--hair-hi:#A87A58;--cape:#C9D1DC;--cape-line:#98A4B3;
  --z-ober:#7FA6D1;--z-hinter:#9B5BB0;--z-nacken:#C27A45;--z-vorne:#4E9B72;
  --shadow:0 1px 2px rgba(35,27,46,.06),0 4px 14px rgba(35,27,46,.05);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16121B;--surface:#201A28;--ink:#EEE8F4;--muted:#A79CB5;--line:#3A3045;
    --accent:#CFA2E0;--accent-ink:#1C1422;--accent-soft:#3A2A45;
    --good:#6CC196;--good-soft:#1D3328;--bad:#EE8177;--bad-soft:#3E1F1C;
    --skin:#D8BBA6;--skin-line:#8F6B56;--face-line:#4A3326;--lip:#C48E80;--hair:#80563C;--hair-line:#3A2417;--hair-hi:#B8896A;--cape:#55606F;--cape-line:#7D8998;
    --z-ober:#8DB5E0;--z-hinter:#C08AD4;--z-nacken:#E3A06B;--z-vorne:#6CC196;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16121B;--surface:#201A28;--ink:#EEE8F4;--muted:#A79CB5;--line:#3A3045;
  --accent:#CFA2E0;--accent-ink:#1C1422;--accent-soft:#3A2A45;
  --good:#6CC196;--good-soft:#1D3328;--bad:#EE8177;--bad-soft:#3E1F1C;
  --skin:#D8BBA6;--skin-line:#8F6B56;--face-line:#4A3326;--lip:#C48E80;--hair:#80563C;--hair-line:#3A2417;--hair-hi:#B8896A;--cape:#55606F;--cape-line:#7D8998;
  --z-ober:#8DB5E0;--z-hinter:#C08AD4;--z-nacken:#E3A06B;--z-vorne:#6CC196;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.55rem;font-weight:800}
h2{font-size:1.3rem;font-weight:700}
p{margin:0;max-width:62ch}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.badge{font-size:.75rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.steps{display:flex;gap:4px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps li{font-size:.78rem;font-weight:700;padding:4px 9px;border-radius:999px;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.steps li.done{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.steps li.now{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.fig svg{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair figure{margin:0;display:flex;flex-direction:column;gap:4px;text-align:center}
.pair figcaption{font-size:.9rem;font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}
.nav{display:flex;justify-content:space-between;gap:10px}
.text{display:flex;flex-direction:column;gap:10px}
.text ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:.9rem;list-style:none;margin:0;padding:0}
.legend span{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.note{font-size:.95rem;color:var(--muted)}
.errcap{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:0 10px 10px 0}
.errcap.ok{border-color:var(--good);background:var(--good-soft)}
.answers{display:flex;flex-direction:column;gap:8px}
.answers .btn{justify-content:flex-start;text-align:left;font-weight:400}
.answers .btn.right{background:var(--good-soft);border-color:var(--good)}
.answers .btn.wrong{background:var(--bad-soft);border-color:var(--bad)}
.imgchoice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgchoice .btn{flex-direction:column;padding:8px;font-weight:700}
.imgchoice .btn.right{background:var(--good-soft);border-color:var(--good)}
.imgchoice .btn.wrong{background:var(--bad-soft);border-color:var(--bad)}
.feedback{padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.merksatz{font-family:var(--f-display);font-size:1.5rem;font-weight:800;line-height:1.3;text-align:center;text-wrap:balance;color:var(--accent);padding:12px 0}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<script>
(function(){
  // ---------- Zeichnung ----------
  // Kopf, Gesicht und Umhang: in jeder Variante exakt gleich (auch die Nase).
  var SKIN = "M60,510 C70,478 110,458 150,450 C156,420 158,380 160,340 C125,318 90,268 88,205 C86,135 138,84 205,82 C258,80 293,108 300,148 C304,170 302,188 298,200 C302,205 305,210 303,216 C301,220 299,223 298,226 C312,248 334,270 350,284 C356,290 353,297 344,298 C338,299 332,298 327,297 C322,297 318,299 316,302 C318,306 322,310 321,314 C318,316 316,317 315,318 C319,320 320,326 316,331 C312,335 308,337 307,340 C309,348 312,356 309,364 C304,376 290,380 276,381 C262,382 250,384 244,392 C240,405 238,420 240,440 C250,452 290,468 330,510 Z";
  var FACE =
    // Augenbraue, Auge mit Wimpern, Nasenflügel, Mundwinkel, Kieferlinie
    '<path d="M268,199 Q284,191 299,197" fill="none" stroke="var(--hair-line)" stroke-width="3.2" stroke-linecap="round"/>' +
    '<path d="M277,213 Q285,206 293,212" fill="none" stroke="var(--face-line)" stroke-width="2.2" stroke-linecap="round"/>' +
    '<path d="M280,217 Q286,219 292,215" fill="none" stroke="var(--face-line)" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>' +
    '<path d="M288,209 l4,-4 M291,211 l5,-3" stroke="var(--face-line)" stroke-width="1.2" stroke-linecap="round"/>' +
    '<path d="M324,289 C327,282 337,282 340,291" fill="none" stroke="var(--skin-line)" stroke-width="1.6" stroke-linecap="round"/>' +
    '<path d="M314,318 L307,320" stroke="var(--skin-line)" stroke-width="1.6" stroke-linecap="round"/>' +
    '<path d="M316,302 C318,306 322,310 321,314 C318,316 316,317 315,318 C319,320 320,326 316,331 C314,327 312,322 314,318 C312,313 313,307 316,302 Z" fill="var(--lip)"/>' +
    '<path d="M204,268 C222,322 250,360 288,376" fill="none" stroke="var(--skin-line)" stroke-width="1.3" opacity=".45"/>';
  var EAR =
    '<path d="M186,212 C200,204 212,216 209,236 C207,252 200,264 191,263 C185,262 184,256 185,250 C181,240 179,222 186,212 Z" fill="var(--skin)" stroke="var(--skin-line)" stroke-width="1.5"/>' +
    '<path d="M190,219 C200,216 205,228 201,240 C199,247 194,248 193,243" fill="none" stroke="var(--skin-line)" stroke-width="1.3"/>';
  // Frisierumhang
  var CAPE = '<path d="M30,530 C44,488 100,462 152,454 C185,470 228,470 250,452 C300,466 350,494 372,530 Z" fill="var(--cape)" stroke="var(--cape-line)" stroke-width="1.5"/>' +
    '<path d="M152,454 C185,470 228,470 250,452" fill="none" stroke="var(--cape-line)" stroke-width="5" stroke-linecap="round"/>';

  // Vorderpartie des Bobs (Seitenlänge bis Kinnhöhe, Ohr bedeckt)
  var BOB_FRONT = " C200,368 235,378 262,374 C268,340 262,290 258,250 C256,215 262,190 272,168 C280,150 290,136 297,126 Z";
  var STYLE = {
    // Vorher: langes, glattes Haar, liegt am Hinterkopf flach an, hinter das Ohr gelegt
    A: {d:"M297,126 C302,96 262,70 200,70 C140,70 96,108 92,168 C88,220 94,262 104,300 C110,340 112,400 108,470 C125,480 150,480 168,468 C168,420 176,330 182,262 C178,236 184,205 205,198 C222,196 236,200 240,206 L244,232 L254,230 C258,190 276,150 297,126 Z",
        ear:true, back:97, len:430},
    // Nachher: graduierter Bob, Aufbau am Hinterhauptbein, Nacken schmal
    B: {d:"M297,126 C304,98 262,56 196,54 C122,52 60,96 44,162 C34,205 34,248 44,276 C54,304 96,322 142,338 C152,342 160,346 164,352" + BOB_FRONT,
        back:41, len:300, stufen:true},
    tief: {d:"M297,126 C302,96 262,70 200,70 C140,70 96,108 92,168 C86,215 86,260 76,300 C62,345 78,384 118,386 C140,388 150,370 164,352" + BOB_FRONT,
        back:82, len:320},
    hoch: {d:"M297,126 C300,70 250,30 180,32 C112,36 78,90 84,160 C86,215 94,262 104,300 C112,330 140,346 164,352" + BOB_FRONT,
        back:96, len:300},
    flach: {d:"M297,126 C302,98 262,72 200,72 C140,72 96,106 90,160 C120,170 160,182 186,196 C210,200 238,204 244,232 L254,230 C258,190 276,150 297,126 Z",
        ear:true, back:94, len:140, stoppel:true}
  };
  var SPIKE = "M296,122 L348,162 L302,178 L292,150 Z";
  var CROWN = [158, 100];
  var NOSE = [354, 290];
  var uid = 0;

  // Haarsträhnen: vom Wirbel aus gefächert, fallen nach unten, auf die Frisurform zugeschnitten
  function strands(len){
    var out = "", cx = CROWN[0], cy = CROWN[1];
    for (var i = 0; i <= 40; i++){
      var a = (-18 + i * 5.4) * Math.PI / 180;
      var r = 120 + (i % 3) * 18;
      var qx = cx + Math.cos(a) * r, qy = cy + Math.sin(a) * r * 0.55;
      var ex = qx + Math.cos(a) * 30, ey = qy + len;
      var sx = cx + Math.cos(a) * 24, sy = cy + Math.sin(a) * 14;
      out += "M" + sx.toFixed(1) + "," + sy.toFixed(1) + " Q" + qx.toFixed(1) + "," + qy.toFixed(1) + " " + ex.toFixed(1) + "," + ey.toFixed(1) + " ";
    }
    return out;
  }

  function hair(key, id, spike){
    var S = STYLE[key], s = "";
    s += '<clipPath id="h' + id + '"><path d="' + S.d + '"/>' + (spike ? '<path d="' + SPIKE + '"/>' : '') + '</clipPath>';
    s += '<path d="' + S.d + '" fill="var(--hair)"/>';
    if (spike) s += '<path d="' + SPIKE + '" fill="var(--hair)"/>';
    s += '<g clip-path="url(#h' + id + ')">';
    s += '<path d="M96,140 C124,92 200,70 282,108" fill="none" stroke="var(--hair-hi)" stroke-width="12" stroke-linecap="round" opacity=".32"/>';
    s += '<path d="' + strands(S.len) + '" fill="none" stroke="var(--hair-line)" stroke-width="1.3" opacity=".55"/>';
    s += '<path d="' + strands(S.len * 0.93) + '" fill="none" stroke="var(--hair-hi)" stroke-width=".9" opacity=".45" transform="translate(4 2)"/>';
    if (S.stufen){
      s += '<path d="M52,205 C62,238 84,262 116,276 M60,258 C78,284 106,300 136,314 M84,300 C104,318 128,330 154,340" fill="none" stroke="var(--hair-line)" stroke-width="2" stroke-linecap="round" opacity=".8"/>';
    }
    s += '</g>';
    s += '<path d="' + S.d + '" fill="none" stroke="var(--hair-line)" stroke-width="1.5"/>';
    if (spike) s += '<path d="' + SPIKE + '" fill="none" stroke="var(--hair-line)" stroke-width="1.5"/>';
    if (S.stoppel){
      s += '<path d="M90,162 C88,230 110,300 160,340 L182,262 L186,198 C160,184 120,170 90,162 Z" fill="var(--hair)" opacity=".22"/>';
    }
    return s;
  }

  function fig(o){
    o = o || {};
    var key = o.hair || "A", S = STYLE[key];
    var id = ++uid;
    var h = o.ohr ? 545 : 490;
    var s = '<svg viewBox="30 20 460 ' + h + '" role="img" aria-label="' + (o.label || "Kopf im Profil") + '">';
    s += '<path d="' + SKIN + '" fill="var(--skin)" stroke="var(--skin-line)" stroke-width="1.5"/>';
    s += FACE + CAPE;
    s += hair(key, id, o.spike);
    if (S.ear) s += EAR;
    if (o.zonen){
      s += '<clipPath id="z' + id + '"><path d="' + S.d + '"/></clipPath>';
      s += '<g clip-path="url(#z' + id + ')" fill-opacity=".72">' +
        '<rect x="0" y="0" width="480" height="185" fill="var(--z-ober)"/>' +
        '<rect x="0" y="185" width="225" height="120" fill="var(--z-hinter)"/>' +
        '<rect x="0" y="305" width="225" height="200" fill="var(--z-nacken)"/>' +
        '<rect x="225" y="160" width="120" height="240" fill="var(--z-vorne)"/>' +
        '</g>';
    }
    if (o.ohr){
      s += '<line x1="190" y1="46" x2="190" y2="520" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/>';
      s += '<text x="180" y="40" text-anchor="end" font-size="15" font-weight="700" fill="var(--accent)" font-family="var(--f-body)">hinten</text>';
      s += '<text x="200" y="40" font-size="15" font-weight="700" fill="var(--accent)" font-family="var(--f-body)">vorne</text>';
      var xb = S.back;
      s += '<line x1="' + xb + '" y1="265" x2="' + xb + '" y2="520" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 4"/>';
      s += '<line x1="' + NOSE[0] + '" y1="' + NOSE[1] + '" x2="' + NOSE[0] + '" y2="520" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 4"/>';
      s += '<circle cx="' + xb + '" cy="265" r="4.5" fill="var(--z-hinter)" stroke="var(--surface)" stroke-width="1.5"/>';
      s += '<circle cx="' + NOSE[0] + '" cy="' + NOSE[1] + '" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="1.5"/>';
      s += '<rect x="' + xb + '" y="518" width="' + (188 - xb) + '" height="16" rx="3" fill="var(--z-hinter)"/>';
      s += '<rect x="192" y="518" width="' + (NOSE[0] - 192) + '" height="16" rx="3" fill="var(--muted)"/>';
      s += '<text x="' + ((xb + 188) / 2) + '" y="556" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" font-family="var(--f-body)">hinten</text>';
      s += '<text x="' + ((192 + NOSE[0]) / 2) + '" y="556" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" font-family="var(--f-body)">vorne</text>';
    }
    if (o.blick === "A"){
      s += '<circle cx="340" cy="280" r="32" fill="var(--bad)" fill-opacity=".12"/>';
      s += '<circle cx="340" cy="280" r="17" fill="var(--bad)" fill-opacity=".25" stroke="var(--bad)" stroke-width="2.5"/>';
    }
    if (o.blick === "B"){
      s += '<line x1="326" y1="278" x2="60" y2="240" stroke="var(--good)" stroke-width="2.5" stroke-dasharray="5 6"/>';
      s += '<circle cx="340" cy="280" r="13" fill="var(--good)" fill-opacity=".25" stroke="var(--good)" stroke-width="2.5"/>';
      s += '<circle cx="48" cy="240" r="13" fill="var(--good)" fill-opacity=".25" stroke="var(--good)" stroke-width="2.5"/>';
    }
    // Fester Hinweis an der Nase
    s += '<line x1="362" y1="234" x2="328" y2="255" stroke="var(--ink)" stroke-width="1.5"/>';
    s += '<text x="366" y="226" font-size="16" font-weight="700" fill="var(--ink)" font-family="var(--f-body)">Nase</text>';
    s += '<text x="366" y="245" font-size="16" font-weight="700" fill="var(--ink)" font-family="var(--f-body)">unverändert</text>';
    s += '</svg>';
    return s;
  }

  // ---------- Inhalte (aus konzept/2d-tool-pilot-nase-im-profil.md) ----------
  var STEPS = ["Ausgangsform","Zielwirkung","Schnitt","Warum","Achten","Check","Merksatz"];

  var FEHLER = {
    tief:  {t:"Aufbau zu tief (im Nacken)", d:"Die Form wirkt schwer und hängend. Es entsteht kein Gegengewicht zur Nase.", fig:{hair:"tief"}},
    hoch:  {t:"Aufbau zu hoch (nur oben)", d:"Der Kopf wirkt nach oben verlängert. Die Nase bleibt im Profil dominant.", fig:{hair:"hoch"}},
    spitz: {t:"Spitzer Pony nach vorne", d:"Vorne entsteht eine zweite Spitze. Der Blick wird zusätzlich zur Nase gelenkt.", fig:{hair:"B", spike:true}},
    flach: {t:"Hinten sehr kurz und flach", d:"Zum Beispiel ein hoher Undercut oder Haar streng nach hinten. Hinten fehlt jedes Gegengewicht, das Profil liegt ganz frei.", fig:{hair:"flach"}},
    gut:   {t:"So passt es", d:"Aufbau etwa am Hinterhauptbein, Nacken schmal, vorne ruhig.", fig:{hair:"B"}, ok:true}
  };

  var FRAGEN = [
    {q:"Was passiert, wenn der Hinterkopf mehr Aufbau bekommt?",
     a:["Die Nase wird kürzer.","Das Verhältnis zwischen vorne und hinten ändert sich. Die Nase wirkt weniger dominant.","Es verändert sich nichts. Man sieht nur den Hinterkopf besser."],
     r:1, f:"Die Nase bleibt gleich. Es verändert sich das Verhältnis."},
    {q:"Bei welchem Profil wirkt die Nase stärker?", bild:true,
     a:["Flacher Hinterkopf","Aufbau am Hinterkopf"],
     r:0, f:"Ohne Gegengewicht hinten bleibt der Blick an der Nase hängen."},
    {q:"Wo sollte der Aufbau am Hinterkopf ungefähr sitzen?",
     a:["Ganz unten im Nacken","Etwa am Hinterhauptbein, ungefähr auf Höhe der Nase","Nur ganz oben am Scheitel"],
     r:1, f:"Zu tief wirkt schwer, zu hoch verlängert den Kopf. Das Gegengewicht sollte etwa gegenüber der Nase liegen."},
    {q:"Richtig oder falsch? „Ein spitzer, nach vorne gerichteter Pony hilft, die Nase auszugleichen.“",
     a:["Richtig","Falsch"],
     r:1, f:"Eine Spitze vorne lenkt den Blick zusätzlich nach vorne. Besser ist eine weiche Vorderpartie."},
    {q:"Eine Kundin mit sehr feinem Haar wünscht sich die Form mit Aufbau am Hinterkopf. Was klärst du zuerst?",
     a:["Nichts. Die Form passt immer.","Ob das Haar den Aufbau hält und ob sie die Form zu Hause stylen kann.","Ob sie einen Pony möchte."],
     r:1, f:"Die beste Form hilft nur, wenn sie im Alltag hält."}
  ];

  // ---------- Zustand ----------
  var st = {screen:0, ohr:true, hair:"A", zonen:true, fehler:"tief", q:0, picked:null, score:0};

  var SCREENS = [
    {step:-1, render:function(){
      return card('<div class="pair">' +
          '<figure>' + fig({hair:"A", label:"Vorher: flacher Hinterkopf"}) + '<figcaption>Vorher</figcaption></figure>' +
          '<figure>' + fig({hair:"B", label:"Nachher: Aufbau am Hinterkopf"}) + '<figcaption>Nachher</figcaption></figure>' +
        '</div>',
        '<h2>Lange Nase im Profil</h2>' +
        '<p>Manche Kundinnen und Kunden haben eine lange oder markante Nase. Die Nase können wir nicht verändern. Aber wir können verändern, wie sie im Verhältnis zum ganzen Kopf wirkt.</p>' +
        '<p>In diesem Beispiel siehst du, wie das im Profil funktioniert. Die Nase bleibt in jedem Bild gleich. Nur die Haarform ändert sich.</p>');
    }},
    {step:0, render:function(){
      return card(fig({hair:"A", ohr:st.ohr, label:"Ausgangsform: flacher Hinterkopf"}) +
        controls(toggle("ohr","Verhältnis zeigen", st.ohr)),
        '<h2>Ausgangsform</h2>' +
        '<p>Schau dir das Profil an. Der Hinterkopf ist flach, das Haar liegt eng an.</p>' +
        '<p>Vor der Ohrlinie ist viel los: Stirn, Nase, Kinn. Hinter der Ohrlinie ist wenig Form. Das Gewicht liegt vorne. Deshalb fällt die Nase besonders auf.</p>' +
        '<p class="note">Die Balken unten zeigen es: Der Kopf ist vorne viel länger als hinten.</p>');
    }},
    {step:1, render:function(){
      return card(fig({hair:st.hair, ohr:st.ohr, label: st.hair==="A" ? "Vorher: flacher Hinterkopf" : "Nachher: Aufbau am Hinterkopf"}) +
        controls(seg("hair",[["A","Vorher"],["B","Nachher"]], st.hair) + toggle("ohr","Verhältnis", st.ohr)),
        '<h2>Zielwirkung</h2>' +
        '<p>Ziel ist ein Gleichgewicht zwischen vorne und hinten. Wenn der Hinterkopf mehr Rundung bekommt, entsteht ein Gegengewicht zur Nase.</p>' +
        '<p>Die Nase bleibt genau gleich. Sie wirkt aber nicht mehr so stark, weil der Kopf als Ganzes ausgeglichener aussieht.</p>' +
        '<p class="note">Schalte ein paar Mal zwischen Vorher und Nachher um. Der Balken „vorne“ bleibt gleich lang, der Balken „hinten“ wächst. Die Nase ändert sich nicht.</p>');
    }},
    {step:2, render:function(){
      var leg = st.zonen ? '<ul class="legend">' +
        '<li><span style="background:var(--z-ober)"></span>Oberkopf</li>' +
        '<li><span style="background:var(--z-hinter)"></span>Hinterkopf</li>' +
        '<li><span style="background:var(--z-nacken)"></span>Nacken</li>' +
        '<li><span style="background:var(--z-vorne)"></span>Vorderpartie</li></ul>' : '';
      return card(fig({hair:"B", zonen:st.zonen, label:"Schnittzonen"}) + leg +
        controls(toggle("zonen","Schnittzonen zeigen", st.zonen)),
        '<h2>Mögliche Schnittentscheidung</h2>' +
        '<ul>' +
        '<li><strong>Hinterkopf:</strong> mit Graduation Aufbau schaffen. Die meiste Fülle sitzt ungefähr am Hinterhauptbein, etwa auf der Höhe, auf der vorne die Nase ist.</li>' +
        '<li><strong>Nacken:</strong> schmal und nah am Kopf. So wirkt der Aufbau darüber deutlicher.</li>' +
        '<li><strong>Oberkopf:</strong> leicht mitführen, damit die Form rund bleibt.</li>' +
        '<li><strong>Vorderpartie:</strong> weich, nicht spitz nach vorne.</li>' +
        '</ul>' +
        '<p>Das ist eine Möglichkeit, nicht die einzige. Entscheidend ist die Wirkung: hinten Aufbau, vorne Ruhe.</p>');
    }},
    {step:3, render:function(){
      return card('<div class="pair">' +
          '<figure>' + fig({hair:"A", blick:"A", label:"Vorher: Blick bleibt an der Nase"}) + '<figcaption>Vorher</figcaption></figure>' +
          '<figure>' + fig({hair:"B", blick:"B", label:"Nachher: Blick verteilt sich"}) + '<figcaption>Nachher</figcaption></figure>' +
        '</div>',
        '<h2>Warum es wirkt</h2>' +
        '<p>Unser Auge vergleicht immer. Es schaut nicht nur auf die Nase, sondern auf den ganzen Umriss des Kopfes.</p>' +
        '<p>Ist hinten wenig Form, bleibt der Blick vorne an der Nase hängen. Ist hinten ein Gegengewicht, verteilt sich der Blick über den ganzen Kopf. Die Nase ist dann ein Teil des Gesamtbildes und nicht mehr der Mittelpunkt.</p>');
    }},
    {step:4, render:function(){
      var f = FEHLER[st.fehler];
      return card(fig(Object.assign({label:f.t}, f.fig)) +
        controls(seg("fehler",[["tief","Zu tief"],["hoch","Zu hoch"],["spitz","Spitz vorne"],["flach","Hinten flach"],["gut","So passt es"]], st.fehler)) +
        '<div class="errcap' + (f.ok ? ' ok' : '') + '"><strong>' + f.t + '</strong><br>' + f.d + '</div>',
        '<h2>Worauf achten: Fehlerbilder</h2>' +
        '<p>Aufbau am Hinterkopf hilft nur, wenn er an der richtigen Stelle sitzt. Schau dir die typischen Fehler nacheinander an.</p>');
    }},
    {step:4, render:function(){
      return card(fig({hair:"B", label:"Zielform"}),
        '<h2>Worauf achten: vor dem Schneiden prüfen</h2>' +
        '<ul>' +
        '<li><strong>Haarstruktur und Haarmenge:</strong> Hält feines Haar den Aufbau?</li>' +
        '<li><strong>Wirbel am Hinterkopf:</strong> Wohin fällt das Haar von selbst?</li>' +
        '<li><strong>Styling zu Hause:</strong> Kann die Kundin oder der Kunde die Form selbst nachstylen?</li>' +
        '<li><strong>Alle Ansichten:</strong> Die Form muss auch von vorne und von hinten stimmig sein.</li>' +
        '<li><strong>Wunsch der Kundin oder des Kunden:</strong> Nicht jede Person möchte ihre Nase ausgleichen. Frag nach, bevor du darauf eingehst, und sprich respektvoll über das Gesicht.</li>' +
        '</ul>');
    }},
    {step:5, render:renderCheck},
    {step:6, render:function(){
      return card('<div class="pair">' +
          '<figure>' + fig({hair:"A", label:"Vorher"}) + '<figcaption>Vorher</figcaption></figure>' +
          '<figure>' + fig({hair:"B", label:"Nachher"}) + '<figcaption>Nachher</figcaption></figure>' +
        '</div>',
        '<h2>Merksatz</h2>' +
        '<p class="merksatz">Die Nase bleibt gleich, das Verhältnis ändert sich.<br>Hinten Aufbau, vorne Ruhe.</p>');
    }}
  ];

  function renderCheck(){
    if (st.q >= FRAGEN.length){
      return card('',
        '<h2>Verständnis-Check</h2>' +
        '<p><strong>' + st.score + ' von ' + FRAGEN.length + '</strong> Fragen beim ersten Versuch richtig.</p>' +
        '<div class="controls"><button class="btn" type="button" data-act="checkReset">Check wiederholen</button></div>');
    }
    var F = FRAGEN[st.q], done = st.picked !== null, html;
    function cls(i){ if(!done) return ""; if(i===F.r) return " right"; if(i===st.picked) return " wrong"; return ""; }
    if (F.bild){
      html = '<div class="imgchoice">' + F.a.map(function(t,i){
        return '<button class="btn' + cls(i) + '" type="button" data-act="pick" data-i="' + i + '"' + (done?' disabled':'') + '>' +
          fig({hair: i===0 ? "A" : "B", label:t}) + t + '</button>';
      }).join("") + '</div>';
    } else {
      html = '<div class="answers">' + F.a.map(function(t,i){
        return '<button class="btn' + cls(i) + '" type="button" data-act="pick" data-i="' + i + '"' + (done?' disabled':'') + '>' + t + '</button>';
      }).join("") + '</div>';
    }
    if (done){
      html += '<div class="feedback"><strong>' + (st.picked===F.r ? "Richtig. " : "Nicht ganz. ") + '</strong>' + F.f + '</div>' +
        '<div class="controls"><button class="btn primary" type="button" data-act="nextQ">' + (st.q < FRAGEN.length-1 ? "Nächste Frage" : "Ergebnis zeigen") + '</button></div>';
    }
    return card('',
      '<div class="eyebrow">Frage ' + (st.q+1) + ' von ' + FRAGEN.length + '</div>' +
      '<h2>' + F.q + '</h2>' + html);
  }

  // ---------- Bausteine ----------
  function card(figHtml, textHtml){
    return (figHtml ? '<section class="card fig">' + figHtml + '</section>' : '') +
      '<section class="card text">' + textHtml + '</section>';
  }
  function controls(inner){ return '<div class="controls">' + inner + '</div>'; }
  function toggle(key, label, on){
    return '<button class="btn' + (on?' on':'') + '" type="button" aria-pressed="' + on + '" data-act="toggle" data-key="' + key + '">' + label + '</button>';
  }
  function seg(key, opts, val){
    return opts.map(function(o){
      var on = o[0]===val;
      return '<button class="btn' + (on?' on':'') + '" type="button" aria-pressed="' + on + '" data-act="set" data-key="' + key + '" data-val="' + o[0] + '">' + o[1] + '</button>';
    }).join("");
  }

  function render(){
    var S = SCREENS[st.screen];
    var steps = '<ol class="steps" aria-label="Lernschritte">' + STEPS.map(function(t,i){
      var c = i < S.step ? "done" : (i === S.step ? "now" : "");
      return '<li class="' + c + '"' + (i===S.step?' aria-current="step"':'') + '>' + t + '</li>';
    }).join("") + '</ol>';
    var last = st.screen === SCREENS.length-1;
    var nav = '<div class="nav">' +
      '<button class="btn" type="button" data-act="prev"' + (st.screen===0?' disabled':'') + '>← Zurück</button>' +
      (last ? '<button class="btn primary" type="button" data-act="restart">Von vorne</button>'
            : '<button class="btn primary" type="button" data-act="next">' + (st.screen===0 ? "Los geht’s" : "Weiter") + ' →</button>') +
      '</div>';
    document.getElementById("app").innerHTML =
      '<div class="top"><div><div class="eyebrow">Formwirkung · Profil</div><h1>Lange Nase im Profil</h1></div><span class="badge">Testversion V1</span></div>' +
      steps + S.render() + nav;
  }

  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
    var a = b.dataset.act, moved = false;
    if (a==="next"){ st.screen = Math.min(st.screen+1, SCREENS.length-1); moved = true; }
    if (a==="prev"){ st.screen = Math.max(st.screen-1, 0); moved = true; }
    if (a==="restart"){ st = {screen:0, ohr:true, hair:"A", zonen:true, fehler:"tief", q:0, picked:null, score:0}; moved = true; }
    if (a==="toggle"){ st[b.dataset.key] = !st[b.dataset.key]; }
    if (a==="set"){ st[b.dataset.key] = b.dataset.val; }
    if (a==="pick"){ st.picked = +b.dataset.i; if (st.picked === FRAGEN[st.q].r) st.score++; }
    if (a==="nextQ"){ st.q++; st.picked = null; }
    if (a==="checkReset"){ st.q = 0; st.picked = null; st.score = 0; }
    render();
    if (moved) window.scrollTo(0,0);
  });

  render();
})();
</script>
</body>
</html>
