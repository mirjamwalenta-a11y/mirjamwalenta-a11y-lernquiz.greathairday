<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZWP-Trainer Friseur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F5F3F7; --surface:#FFFFFF; --surface-2:#EEEAF3; --ink:#231B2E; --muted:#6B6278; --line:#DDD6E6;
  --accent:#6D2E7F; --accent-ink:#FFFFFF; --accent-soft:#F1E4F6; --copper:#A85A26;
  --good:#2F7D55; --good-soft:#E3F2EA; --warn:#96600F; --warn-soft:#FBF0DC; --bad:#B3362D; --bad-soft:#FBE6E3;
  --shadow:0 1px 2px rgba(35,27,46,.06),0 4px 16px rgba(35,27,46,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16121B; --surface:#201A28; --surface-2:#2A2233; --ink:#EEE8F4; --muted:#A79CB5; --line:#3A3045;
    --accent:#CFA2E0; --accent-ink:#1C1422; --accent-soft:#3A2A45; --copper:#E3A06B;
    --good:#6CC196; --good-soft:#1D3328; --warn:#E3B45C; --warn-soft:#3A2E16; --bad:#EE8177; --bad-soft:#3E1F1C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16121B; --surface:#201A28; --surface-2:#2A2233; --ink:#EEE8F4; --muted:#A79CB5; --line:#3A3045;
  --accent:#CFA2E0; --accent-ink:#1C1422; --accent-soft:#3A2A45; --copper:#E3A06B;
  --good:#6CC196; --good-soft:#1D3328; --warn:#E3B45C; --warn-soft:#3A2E16; --bad:#EE8177; --bad-soft:#3E1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-family:var(--f-body);font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:0}
.brand .dot{color:var(--copper)}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs svg{width:20px;height:20px;flex:none}
.profile-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;display:flex;gap:6px;align-items:center;max-width:180px}
.profile-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-chip .av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.75rem;flex:none}

main{padding-block:24px 40px;display:flex;flex-direction:column;gap:28px}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;font-weight:700;color:var(--muted)}
.lead{color:var(--muted);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.grid-2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.back{align-self:flex-start}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.time{font-family:var(--f-mono);font-weight:500}

.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* Start */
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.ring{width:132px;height:132px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1}
.ring .v small{display:block;font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.countdown{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.countdown b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;color:var(--copper)}
.exam-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.exam-strip button{border:0;border-right:1px solid var(--line);background:none;text-align:left;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.exam-strip button:last-child{border-right:0}
.exam-strip button:hover{background:var(--surface-2)}
.exam-strip .t{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.exam-strip .n{font-weight:700;font-family:var(--f-display);font-size:1rem;line-height:1.2}
.exam-strip .bar{margin-top:auto}
.weak li{display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding-block:8px;border-bottom:1px solid var(--line)}
.weak li:last-child{border-bottom:0}
ul.clean{list-style:none;margin:0;padding:0}

/* Praxis */
.part-card{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.part-card:hover{border-color:var(--accent)}
.part-card .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.crit{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.crit li::marker{color:var(--accent)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);font-family:var(--f-mono);font-weight:700;font-size:.85rem;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.warnbox{background:var(--bad-soft);border-radius:14px;padding:16px 18px;color:var(--ink)}
.warnbox h3{color:var(--bad)}
.warnbox ul{margin:8px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;color:var(--muted)}
.subtabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.timer{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.timer .dial{width:150px;height:150px;position:relative;flex:none}
.timer .dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .digits{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums}
.timer .ctrl{display:flex;flex-direction:column;gap:8px;flex:1;min-width:180px}
.timer.alert .digits{color:var(--bad)}
.alertline{font-weight:700;color:var(--warn);min-height:1.5em}

.rate-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.rate-row:last-child{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 10px;cursor:pointer;font-weight:700;font-size:.85rem;color:var(--muted);min-height:40px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"].g{background:var(--good);color:#fff}
.seg button[aria-pressed="true"].m{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"].b{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"].n{background:var(--ink);color:var(--bg)}
textarea,input[type=text],input[type=date]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.9rem}

table.hist{width:100%;border-collapse:collapse;font-size:.92rem}
table.hist th,table.hist td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.hist th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll-x{overflow-x:auto}

/* Theorie */
.cat{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left}
.cat:hover{border-color:var(--accent)}
.cat .bar{grid-column:1/-1}
.quiz{max-width:680px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.quiz .q{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.25}
.answers{display:flex;flex-direction:column;gap:10px}
.answers button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;cursor:pointer;line-height:1.4;min-height:52px}
.answers button:hover:not(:disabled){border-color:var(--accent)}
.answers button.right{border-color:var(--good);background:var(--good-soft)}
.answers button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.answers button:disabled{cursor:default}
.explain{background:var(--accent-soft);border-radius:12px;padding:14px 16px}
.progress-dots{display:flex;gap:4px}
.progress-dots i{flex:1;height:5px;border-radius:9px;background:var(--surface-2)}
.progress-dots i.ok{background:var(--good)}
.progress-dots i.no{background:var(--bad)}
.progress-dots i.part{background:var(--warn)}
.progress-dots i.cur{background:var(--accent)}
.model{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.model ul{margin:8px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}

/* Diagnose */
.diag table{border-collapse:collapse;width:100%}
.diag th,.diag td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.diag td.c{text-align:center;width:80px}
.diag th.c{text-align:center}
.diag input[type=checkbox],.diag input[type=radio],.pack input{width:20px;height:20px;accent-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0;cursor:pointer}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px 16px}
.hint{border-left:4px solid var(--copper);background:var(--surface-2);padding:12px 14px;border-radius:0 10px 10px 0}

/* Prüfungstag */
.schedule{display:flex;flex-direction:column}
.schedule li{display:grid;grid-template-columns:120px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.schedule li.pause{color:var(--muted);font-size:.9rem}
.schedule li.now{background:var(--accent-soft);margin-inline:-10px;padding-inline:10px;border-radius:8px}
.schedule li.done{color:var(--muted);text-decoration:line-through}
.schedule .tm{font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.pack h3{margin-top:6px}
.pack label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer;border-bottom:1px solid var(--line)}
.pack label.done span{color:var(--muted);text-decoration:line-through}

.profiles{display:flex;flex-direction:column;gap:10px}
.profiles .p{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.profiles .p input{flex:1;min-width:140px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;box-shadow:var(--shadow);white-space:nowrap}
footer{padding-block:0 32px;color:var(--muted);font-size:.8rem}

@media (max-width:760px){
  header.top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  nav.tabs button{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 4px;border-radius:10px;flex:1}
  .profile-chip{margin-left:auto}
  main{padding-bottom:110px}
  .exam-strip{grid-template-columns:1fr 1fr}
  .exam-strip button{border-bottom:1px solid var(--line)}
  .exam-strip button:nth-child(2n){border-right:0}
  .exam-strip button:last-child{grid-column:1/-1;border-bottom:0}
  .hero{grid-template-columns:1fr;justify-items:start}
  .rate-row{grid-template-columns:1fr}
  .schedule li{grid-template-columns:96px 1fr;}
  .schedule li > :last-child{grid-column:2}
  .brand small{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .bar i,.ring circle{transition:all .5s ease}
  .answers button{transition:border-color .15s,background .15s}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">ZWP<span class="dot">·</span>Trainer <small>Friseur/in Wien</small></div>
    <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
    <button class="profile-chip" id="profileChip" data-a="profiles" aria-label="Lernprofil wechseln"></button>
  </div>
</header>
<main class="wrap" id="main"></main>
<footer class="wrap">Inhalte nach der Broschüre „Karriere mit Schere: Die Zwischenprüfung“ der Landesinnung Wien der Friseure. Dein Lernfortschritt bleibt nur auf diesem Gerät gespeichert.</footer>

<script>
"use strict";
/* ============================================================
   INHALTE: Prüfungsteile (aus der Broschüre der Landesinnung Wien)
   ============================================================ */
const PARTS = [
 { id:'technik', name:'Technikkopf', min:35, model:'am Technikkopf',
   intro:'Handgelegte Wasserwellen, zehn Papilloten in Wellenform und zehn Dauerwellwickler. Das Ergebnis soll den Mustervorlagen möglichst genau entsprechen.',
   sections:[
    { id:'ww', name:'Handgelegte Wasserwellen', crit:[
      'Sauberkeit und Reinheit der Wellen','Gut sichtbares Wellental','Gleichmäßige Wellenkanten','Gleiche Wellenbreite (von Kante zu Kante)',
      'Wellen bis zum Grund durchgearbeitet, nicht nur an der Oberfläche','Haare in der Welle nicht verzogen','Mindestens 3 Wellen (Ende darf mit Papilloten abschließen)'] },
    { id:'pap', name:'Papillotieren (10 Stück)', crit:[
      'Exaktes, gleichmäßiges Abteilen der Passees','Sauberst gekämmte Passees','Gleichmäßig in Rundung und Größe','Gleichmäßige Anordnung der Papilloten',
      'Reihenweise nach links bzw. rechts (oder umgekehrt) angeordnet','Gleichmäßige Spannung','Haarspitzen liegen innen','Clips am Papillotenhals, Form nicht verändert'] },
    { id:'dw', name:'Dauerwelltechnik (10 Wickler)', crit:[
      'Saubere, gleichmäßige Abteilungen','Gleichmäßige Spannung (keine Schlaufen)','Stärke der Passees passt','Im richtigen Winkel aufgedreht','Wicklerbreite, Wicklerstärke und Abteilung passen zusammen',
      'Ordnung bei der Platzierung der Wickler','Spitzen nicht umgebogen','Spitzen gerade über dem Wickler','Spitzenpapier sauber eingearbeitet','Gummis gleichmäßig gesetzt',
      'Richtig abgesteckt','Mittlere Wicklerstärken verwendet','Gestellte Anforderung erfüllt'] }
   ],
   ablauf:[
    { t:'Handgelegte Wasserwellen', s:['Haar gut anfeuchten, Wellengel oder Frisiercreme sparsam einarbeiten und glatt durchkämmen.','Scheitel sauber ziehen und die Kämmrichtung für die erste Welle festlegen.','Erste Kante: Zeigefinger flach auflegen, Kamm direkt darunter einsetzen und das Haar ca. 2 cm in die Gegenrichtung schieben.','Kamm flach andrücken, Kante mit Fingern fixieren (Wellenkamm oder Clip erlaubt).','Nächste Kante in die Gegenrichtung formen, gleiche Wellenbreite halten.','Jede Welle bis zum Grund durcharbeiten, nicht nur oben drüberkämmen.','Mindestens 3 Wellen legen, das Ende darf mit Papilloten abschließen.','Wellenkämme und Clipse vor der Benotung entfernen! Finish nur in kleinen Mengen.'] },
    { t:'Papillotieren', s:['Gleich große, exakt abgeteilte Passees machen und sauber durchkämmen.','Von den Spitzen her in gleichmäßiger Rundung eindrehen, die Spitzen liegen innen.','Papillote flach an den Kopf legen, alle gleich groß.','Clip am Papillotenhals ansetzen, er darf die Form nicht verändern.','Reihenweise nach links bzw. rechts anordnen, gleichmäßige Spannung.'] },
    { t:'Dauerwellwickler', s:['Abteilung genau so breit wie der Wickler und so tief wie sein Durchmesser.','Passee im richtigen Winkel zum Kopf abheben und sauber durchkämmen.','Spitzenpapier sauber einarbeiten, die Spitzen liegen gerade über dem Wickler.','Mit gleichmäßiger Spannung eindrehen, ohne Schlaufen und ohne umgebogene Spitzen.','Wickler auf der eigenen Basis ablegen, Gummi gleichmäßig und ohne Druck auf den Ansatz setzen.','Ordentlich platzieren und richtig abstecken, mittlere Wicklerstärken verwenden.'] }
   ],
   plan:[['Wasserwellen','ca. 13 Min.'],['10 Papilloten','ca. 8 Min.'],['10 Dauerwellwickler','ca. 11 Min.'],['Kontrolle, Clips und Kämme entfernen','ca. 3 Min.']],
   achtung:['Wellenkämme und Clipse nicht entfernt → müssen vor der Benotung weg','Zu viel Finishprodukt (nur kleine Mengen erlaubt)','Umgebogene Spitzen oder Schlaufen bei den Wicklern','Weniger als 3 Wellen']
 },
 { id:'nagel', name:'Nagelpflege', min:35, model:'am Damenmodell (eine Hand)',
   intro:'Komplette Maniküre an einer von der Kommission bestimmten Hand, Nagelhaut entfernen, Unterlack und gut sichtbarer farbiger Decklack, Nageldesign an 2 Fingern passend zum Themenschwerpunkt.',
   sections:[
    { id:'ma', name:'Maniküre', crit:['Vorherige Handmassage an der nicht zu manikürenden Hand','Einwandfreies, sauberes Werkzeug und Wäsche, Wasserbad','Gleichmäßige, formschöne Feilarbeit','Nagelhaut zurückgeschoben und gelöst','Nagelhaut fachgerecht entfernt','Eventuelle Wundversorgung richtig'] },
    { id:'la', name:'Lack & Design', crit:['Sauberes und formschönes Lackieren (Unterlack + farbiger Decklack)','Decklack gut sichtbar','Nageldesign an 2 Fingernägeln passend zum Thema'] }

function hash(s){let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return (x>>>0).toString(36);}

  c.open.forEach(o=>QUESTIONS.push({id:c.id+'-o'+hash(o[0]),cat:c.id,type:'open',q:o[0],pts:o[1]}));
});

function allCrit(p){return p.sections.flatMap(s=>s.crit);}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* Lernstand */
const INTERVAL=[0,0,1,3,7,14];
function qs(id){return D.q[id]||null;}
function grade(id,res){const s=qs(id)||{b:0};let b;
  if(res==='yes')b=Math.min(5,(s.b||0)+1);else if(res==='part')b=Math.max(1,s.b||1);else b=1;
  const days=res==='part'?1:INTERVAL[b];D.q[id]={b,d:Date.now()+days*864e5};save();}
function catProgress(cid){const qsA=QUESTIONS.filter(q=>q.cat===cid);const m=qsA.filter(q=>(qs(q.id)?.b||0)>=3).length;const seen=qsA.filter(q=>qs(q.id)).length;return {total:qsA.length,mastered:m,seen,p:m/qsA.length};}
function theoryScore(){return QUESTIONS.reduce((a,q)=>a+Math.min(qs(q.id)?.b||0,3)/3,0)/QUESTIONS.length;}
function dueCount(){const now=Date.now();return QUESTIONS.filter(q=>qs(q.id)&&qs(q.id).d<=now).length;}
function sessionScore(s){const v=Object.values(s.r);return v.length?v.reduce((a,b)=>a+b,0)/(2*v.length):0;}
function lastSession(pid){const l=D.praxis.filter(s=>s.part===pid);return l.length?l[l.length-1]:null;}
function partScore(pid){const s=lastSession(pid);return s?sessionScore(s):0;}
function praxisScore(){return PARTS.reduce((a,p)=>a+partScore(p.id),0)/PARTS.length;}
function readiness(){return .6*praxisScore()+.4*theoryScore();}
function weakSpots(pid,n){const counts={};
  PARTS.filter(p=>!pid||p.id===pid).forEach(p=>{D.praxis.filter(s=>s.part===p.id).slice(-3).forEach(s=>{for(const [cid,v] of Object.entries(s.r)){if(v<2&&CRIT[cid]){counts[cid]=counts[cid]||{n:0,bad:0};counts[cid].n++;if(v===0)counts[cid].bad++;}}});});
  return Object.entries(counts).sort((a,b)=>(b[1].n+b[1].bad)-(a[1].n+a[1].bad)).slice(0,n).map(([cid,c])=>({...CRIT[cid],...c}));}
function daysLeft(){if(!D.examDate)return null;const t=new Date(D.examDate+'T08:00:00');const today=new Date();today.setHours(0,0,0,0);return Math.round((new Date(D.examDate+'T00:00:00')-today)/864e5);}

let T=null, tInt=null, audioCtx=null, wakeLock=null;
function beep(n){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);const t0=audioCtx.currentTime+i*.35;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.3,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.25);o.start(t0);o.stop(t0+.3);}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(n>1?[200,100,200]:200);}catch(e){}}
function newTimer(min,label,onEnd){stopTimer();T={total:min*60,remain:min*60,running:false,label,onEnd,warned:{}};}
function startTimer(){if(!T||T.running)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume();}catch(e){}
  T.running=true;T.last=Date.now();tInt=setInterval(tick,250);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wakeLock=w).catch(()=>{});}catch(e){}
  paintTimer();}
function pauseTimer(){if(!T)return;T.running=false;clearInterval(tInt);paintTimer();}
function stopTimer(){clearInterval(tInt);if(T)T.running=false;try{wakeLock&&wakeLock.release();}catch(e){}wakeLock=null;}
function tick(){if(!T||!T.running)return;const now=Date.now();T.remain-=(now-T.last)/1000;T.last=now;
  [[600,'Noch 10 Minuten',1],[300,'Noch 5 Minuten',2]].forEach(([s,msg,n])=>{if(T.remain<=s&&T.total>s&&!T.warned[s]){T.warned[s]=1;T.msg=msg;beep(n);}});
  if(T.remain<=0){T.remain=0;T.running=false;clearInterval(tInt);T.msg='Zeit ist um!';beep(3);if(T.onEnd)T.onEnd();}
  paintTimer();}
function timerHTML(){if(!T)return'';const C=2*Math.PI*64;
  return `<div class="timer ${T.remain<=300?'alert':''}" id="timer"><div class="dial"><svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="64" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle id="tarc" cx="75" cy="75" r="64" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-T.remain/T.total)}"/></svg><div class="digits" id="tdig" role="timer" aria-live="off">${mmss(T.remain)}</div></div>
  <div class="ctrl"><div class="eyebrow">${esc(T.label)} · ${T.total/60} Min. wie bei der Prüfung</div><div class="alertline" id="tmsg" aria-live="polite">${esc(T.msg||'')}</div>
  <div class="row">${T.running?'<button class="btn" data-a="tpause">Pause</button>':`<button class="btn primary" data-a="tstart">${T.remain<T.total?'Weiter':'Start'}</button>`}<button class="btn ghost" data-a="treset">Zurücksetzen</button></div></div></div>`;}
function paintTimer(){const el=$('#timer');if(!el||!T)return;const C=2*Math.PI*64;
  $('#tdig').textContent=mmss(T.remain);$('#tarc').setAttribute('stroke-dashoffset',C*(1-T.remain/T.total));$('#tmsg').textContent=T.msg||'';
  el.classList.toggle('alert',T.remain<=300);
  const ctrl=el.querySelector('.row');const want=T.running?'run':'stop';if(ctrl.dataset.s!==want){ctrl.dataset.s=want;ctrl.innerHTML=(T.running?'<button class="btn" data-a="tpause">Pause</button>':`<button class="btn primary" data-a="tstart">${T.remain>0&&T.remain<T.total?'Weiter':'Start'}</button>`)+'<button class="btn ghost" data-a="treset">Zurücksetzen</button>';}}

function pickQuestions(cat,n,type){const now=Date.now();const pool=QUESTIONS.filter(q=>q.type===type&&(!cat||q.cat===cat));
 const due=shuffle(pool.filter(q=>qs(q.id)&&qs(q.id).d<=now)).sort((a,b)=>qs(a.id).b-qs(b.id).b);
 const fresh=shuffle(pool.filter(q=>!qs(q.id)));
 const later=pool.filter(q=>qs(q.id)&&qs(q.id).d>now).sort((a,b)=>qs(a.id).d-qs(b.id).d);
 return shuffle([...due,...fresh,...later].slice(0,n));}

function startQuiz(cat,type){const kind=type;let items;
 if(type==='sim'){items=shuffle(QUESTIONS.filter(q=>q.type==='open')).slice(0,5);newTimer(10,'Fachgespräch');}
 else items=pickQuestions(cat,type==='open'?5:10,type);
 QZ={kind,cat,items:items.map(q=>({q,opts:q.type==='mc'?shuffle([q.a,...q.w]):null,res:null,pick:null,shown:false})),i:0};
 go('theorie');}

 const title=QZ.kind==='sim'?'Fachgespräch-Simulation':QZ.kind==='open'?'Prüferfragen':(QZ.cat?CAT[QZ.cat].name:'Lernrunde');
 if(QZ.i>=n){const ok=QZ.items.filter(x=>x.res==='yes').length;
  return `<div class="quiz"><div class="eyebrow">${esc(title)}</div>${dots}<h1>${ok} von ${n} ${QZ.kind==='mc'?'richtig':'gewusst'}</h1>

 const q=it.q;let body='';
 if(q.type==='mc'){body=`<div class="answers">${it.opts.map((o,k)=>{let cls='';if(it.pick!=null){if(o===q.a)cls='right';else if(k===it.pick)cls='wrong';}return `<button data-a="ans" data-k="${k}" class="${cls}" ${it.pick!=null?'disabled':''}>${esc(o)}</button>`;}).join('')}</div>
  ${it.pick!=null?`<div class="explain"><strong>${it.res==='yes'?'Richtig!':'Leider falsch.'}</strong> ${it.res==='yes'?'':'Richtig ist: '+esc(q.a)+'. '}${esc(q.e)}</div><button class="btn primary" data-a="next">${QZ.i+1<n?'Nächste Frage':'Ergebnis ansehen'}</button>`:''}`;}
 else{body=it.shown?`<div class="model"><div class="eyebrow">Das sollte in deiner Antwort vorkommen</div><ul>${q.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>
  ${it.res?`<button class="btn primary" data-a="next">${QZ.i+1<n?'Nächste Frage':'Ergebnis ansehen'}</button>`:`<div class="stack"><div class="small muted">Wie gut war die Antwort?</div><div class="row"><button class="btn" data-a="self" data-r="yes" style="border-color:var(--good);color:var(--good)">Gewusst</button><button class="btn" data-a="self" data-r="part" style="border-color:var(--warn);color:var(--warn)">Teilweise</button><button class="btn" data-a="self" data-r="no" style="border-color:var(--bad);color:var(--bad)">Noch nicht</button></div></div>`}`
  :`<p class="muted">Antworte laut und in ganzen Sätzen, so wie bei der Prüfung. Danach die Musterantwort ansehen.</p><button class="btn primary" data-a="show">Musterantwort zeigen</button>`;}
 return `<div class="quiz"><div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(title)} · ${esc(CAT[q.cat].name)}</span><span class="small muted num">Frage ${QZ.i+1} von ${n}</span></div>${dots}
  ${QZ.kind==='sim'?`<div class="card">${timerHTML()}</div>`:''}

const SURF=['fein/ebenmäßig','uneben/trocken','fett/glänzend','neigt zu Faltenbildung','gerötet/empfindlich'];
const PORES=['kleinporig','mittel','großporig'];const BLOOD=['stark','mittel','schwach'];

function diagnoseHTML(){const sub=V.sub||'faelle';

 ${sub==='faelle'?casesHTML():sheetHTML()}`;}
function casesHTML(){const done=Object.values(D.cases).filter(Boolean).length;

function sheetHTML(){const d=D.diag;const ck=(k)=>d[k]?'checked':'';
 const zoneRow=(grp,opts,type)=>opts.map(o=>`<tr><td>${esc(o)}</td>${['T','W'].map(z=>{const k=grp+'|'+z+'|'+(type==='radio'?'':o);const id='d-'+hash(grp+z+o);return type==='radio'?`<td class="c"><input type="radio" id="${id}" name="${grp}${z}" data-a="diag" data-k="${grp}|${z}" data-v="${esc(o)}" ${d[grp+'|'+z]===o?'checked':''} aria-label="${esc(o)} ${z==='T'?'T-Zone':'Wange'}"></td>`:`<td class="c"><input type="checkbox" id="${id}" data-a="diag" data-k="${k}" ${ck(k)} aria-label="${esc(o)} ${z==='T'?'T-Zone':'Wange'}"></td>`;}).join('')}</tr>`).join('');
 const hint=diagHint();
 return `<section class="panel diag stack"><div class="eyebrow">Technikblatt Hautbeurteilung (Diagnose, Behandlungsplan)</div>

  <div class="scroll-x"><table><thead><tr><th>Durchblutung</th><th class="c">T-Zone</th><th class="c">Wange</th></tr></thead><tbody>${zoneRow('blut',BLOOD,'radio')}</tbody></table></div></div>
  <div><h3>Besonderheiten</h3><div class="chkgrid">${SPECIAL.map(s=>{const k='sp|'+s;return `<label class="chk" for="d-${hash(k)}"><input type="checkbox" id="d-${hash(k)}" data-a="diag" data-k="${esc(k)}" ${ck(k)}>${esc(s)}</label>`;}).join('')}</div></div>
  ${hint?`<div class="hint" id="dhint"><strong>Einschätzung:</strong> ${hint}</div>`:`<div class="hint" id="dhint">Kreuze die Hautoberfläche für T-Zone und Wange an, dann bekommst du hier eine Einschätzung des Hauttyps.</div>`}
  <div class="stack"><h3>Behandlungsplan (verwendete Produkte)</h3>${['Reinigung','Gesichtswasser','Massage','Pflege / Make-up-Grundlage','Brauen- und Wimpernfarbe','Sonstiges'].map((l,i)=>`<label class="f" for="dp${i}">${l}<input type="text" id="dp${i}" data-a="diagt" data-k="plan${i}" value="${esc(d['plan'+i]||'')}"></label>`).join('')}</div>
  <div class="row"><button class="btn" data-a="diagclear">Blatt leeren</button><span class="muted small">Wird automatisch auf diesem Gerät gespeichert. Für die Prüfung auf das Papier-Blatt übertragen.</span></div></section>`;}
function diagHint(){const d=D.diag;const has=(o,z)=>d['surf|'+z+'|'+o];
 const fT=has('fett/glänzend','T'),fW=has('fett/glänzend','W'),tr=has('uneben/trocken','T')||has('uneben/trocken','W'),rot=has('gerötet/empfindlich','T')||has('gerötet/empfindlich','W'),fal=has('neigt zu Faltenbildung','T')||has('neigt zu Faltenbildung','W'),fein=has('fein/ebenmäßig','T')&&has('fein/ebenmäßig','W');
 const unrein=d['sp|Komedonen']||d['sp|Pustelbildung']||d['sp|Akne'];const out=[];
 if(fT&&!fW)out.push('<b>Mischhaut</b>: T-Zone ausgleichend und klärend behandeln, Wangen mild pflegen.');
 else if(fT&&fW)out.push('<b>Fette Haut</b>: Reinigungsgel, ausgleichende Pflege, keine stark durchblutende Massage.');
 else if(tr)out.push('<b>Trockene Haut</b>: milde, rückfettende Reinigungsmilch, reichhaltige Pflege, belebende Massage.');
 else if(fein)out.push('<b>Normale Haut</b>: den guten Zustand erhalten, mild reinigen, ausgewogen pflegen.');
 if(unrein)out.push('<b>Unreinheiten</b>: entzündete Stellen aussparen, nichts ausdrücken.');
 if(rot||d['blut|W']==='stark'||d['blut|T']==='stark')out.push('<b>Empfindlich/gerötet</b>: beruhigende Streichungen, lauwarme Kompressen, kein Alkohol im Gesichtswasser.');
 if(fal)out.push('<b>Faltenneigung</b>: reichhaltige Pflege, straffende Massage.');
 if(d['sp|Milien (Grieskörner)'])out.push('<b>Milien</b>: nicht ausdrücken, nur vermerken.');
 return out.join('<br>');}

/* ---------- Prüfungstag ---------- */
function tagHTML(){if(SIM)return simHTML();const dl=daysLeft();const tot=PACK.reduce((a,g)=>a+g.i.length,0),done=Object.values(D.pack).filter(Boolean).length;
 return `<section class="stack"><div class="eyebrow">Prüfungstag</div><h1>Gut vorbereitet am Prüfungstag</h1></section>
 <section class="grid-2"><div class="card stack"><label class="f" for="examdate">Mein Prüfungstermin<input type="date" id="examdate" data-a="examdate" value="${esc(D.examDate)}"></label>${dl!=null&&dl>=0?`<p><span class="countdown"><b class="num">${dl}</b><span>${dl===1?'Tag':'Tage'} noch</span></span></p>`:''}<p class="muted small">Die Anmeldung und die Prüfungsgebühr laufen über die Ausschreibung der Landesinnung Wien der Friseure.</p></div>
  <div class="card stack"><div class="eyebrow">Generalprobe</div><h3>Prüfungstag-Simulation</h3><p class="muted small">Alle vier Praxisteile hintereinander mit den echten Zeiten und 5 Minuten Umbau dazwischen, zum Schluss 10 Minuten Fachgespräch. Plane gut 3 Stunden ein.</p><button class="btn primary" data-a="simstart">Simulation starten</button></div></section>
 <section class="panel stack"><h2>Zeitplan Vormittag</h2><p class="muted small">Nachmittagsgruppe: Beginn 12:30 Uhr, gleicher Ablauf, Zeugnisübergabe ca. 16:35 Uhr.</p><ul class="clean schedule">${SCHEDULE.map(s=>`<li class="${s.p?'pause':''}"><span class="tm">${s.s}–${s.e}</span><span>${esc(s.n)}</span><span class="pill time">${s.fach?'10 Min.':s.min+' Min.'}</span></li>`).join('')}<li><span class="tm">ca. 11:50</span><span>Übergabe der Zeugnisse</span><span></span></li></ul></section>
 <section class="panel stack pack"><div class="row" style="justify-content:space-between"><h2>Packliste</h2><span class="pill ${done===tot?'good':'accent'} num">${done}/${tot}</span></div><p class="muted small">Ein Vorschlag, den ihr gemeinsam ergänzen könnt. Du musst sämtliches Werkzeug, alle Produkte und Materialien selbst mitbringen.</p>
  ${PACK.map(g=>`<div><h3>${esc(g.t)}</h3>${g.i.map(i=>{const k=hash(g.t+i);return `<label class="${D.pack[k]?'done':''}" for="pk-${k}"><input type="checkbox" id="pk-${k}" data-a="pack" data-k="${k}" ${D.pack[k]?'checked':''}><span>${esc(i)}</span></label>`;}).join('')}</div>`).join('')}
  <div><button class="btn ghost" data-a="packclear">Alle Haken entfernen</button></div></section>`;}

function simBlocks(){return SCHEDULE.slice(1);}
function startSimBlock(){const b=simBlocks()[SIM.i];newTimer(b.min,b.n,()=>{render();});}
function simHTML(){const bl=simBlocks();if(SIM.i>=bl.length)return `<section class="stack"><div class="eyebrow">Simulation beendet</div><h1>Geschafft, gut gemacht!</h1><p class="lead">Bewerte jetzt jeden Praxisteil mit den Kriterien, am besten gemeinsam mit deiner Ausbilderin.</p><div class="row">${PARTS.map(p=>`<button class="btn" data-a="rateonly" data-id="${p.id}">${p.name} bewerten</button>`).join('')}</div><button class="btn ghost back" data-a="simend">Zurück zum Prüfungstag</button></section>`;
 const b=bl[SIM.i],p=b.part?PART[b.part]:null;
 return `<section class="stack"><div class="eyebrow">Simulation · Block ${SIM.i+1} von ${bl.length}</div><h1>${esc(b.n)}</h1></section>
 <section class="card">${timerHTML()}</section>
 ${p?`<section class="panel stack"><h3>Denk dran</h3><ul class="crit">${p.achtung.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></section>`:b.fach?`<section class="panel stack"><h3>Fachgespräch</h3><p>Die Ausbilderin stellt Fragen aus allen Themen. Tipp: Starte danach die Fachgespräch-Simulation im Bereich Fachgespräch.</p><button class="btn" data-a="quiz" data-cat="" data-type="sim">Fachgespräch-Simulation öffnen</button></section>`:`<section class="panel"><p>Arbeitsplatz aufräumen, Werkzeug desinfizieren, nächsten Teil vorbereiten.</p></section>`}
 <section class="panel"><ul class="clean schedule">${bl.map((x,i)=>`<li class="${i<SIM.i?'done':i===SIM.i?'now':''} ${x.p?'pause':''}"><span class="tm">${x.s}</span><span>${esc(x.n)}</span><span class="pill time">${x.min} Min.</span></li>`).join('')}</ul></section>
 <div class="row"><button class="btn primary" data-a="simnext">${SIM.i+1<bl.length?'Weiter zu: '+esc(bl[SIM.i+1].n):'Simulation abschließen'}</button><button class="btn ghost" data-a="simend">Abbrechen</button></div>`;}

/* ============================================================
   Ereignisse
   ============================================================ */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT'||el.tagName==='TEXTAREA')return;const a=el.dataset.a,ds=el.dataset;
 switch(a){
  case 'tab': pauseTimer(); if(QZ&&QZ.kind==='sim'&&ds.t!=='theorie')QZ=null; go(ds.t); break;
  case 'profiles': V.profiles=!V.profiles;delPending=null;render();break;
  case 'padd':{const id='p'+Date.now().toString(36);profiles.list.push({id,name:''});save();profiles.active=id;D=loadData();save();QZ=null;SIM=null;DRAFT=null;stopTimer();render();setTimeout(()=>{const i=$('#pn-'+id);i&&i.focus();},30);break;}
  case 'pswitch': profiles.active=ds.id;D=loadData();save();QZ=null;SIM=null;DRAFT=null;stopTimer();V={tab:'start',profiles:true};render();toast('Profil gewechselt');break;
  case 'pdelask': delPending=ds.id;render();break;
  case 'pdel': profiles.list=profiles.list.filter(p=>p.id!==ds.id);store.del('zwp:data:'+ds.id);if(profiles.active===ds.id){profiles.active=profiles.list[0].id;D=loadData();}delPending=null;save();render();toast('Profil gelöscht');break;
  case 'part': stopTimer();SIM=null;go('praxis',{part:ds.id});break;
  case 'sub': V.sub=ds.s;render();break;
  case 'session': DRAFT=null;newTimer(PART[ds.id].min,PART[ds.id].name);go('praxis',{session:ds.id,timer:true});break;
  case 'rateonly': stopTimer();SIM=null;DRAFT=null;T=null;go('praxis',{session:ds.id,timer:false});break;
  case 'rate': DRAFT.r[ds.c]=+ds.v;{const row=el.parentElement;row.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===el));const n=Object.keys(DRAFT.r).length;$('#ratedinfo').textContent=n+' von '+allCrit(PART[DRAFT.part]).length+' Punkten bewertet';$('[data-a="savesession"]').disabled=!n;}break;
  case 'who': DRAFT.who=ds.w;el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===el));break;
  case 'savesession':{const sec=V.timer&&T?Math.round(T.total-T.remain):null;D.praxis.push({part:DRAFT.part,date:Date.now(),who:DRAFT.who,r:DRAFT.r,note:DRAFT.note,sec:sec&&sec>0?sec:null});save();const pid=DRAFT.part;const sc=sessionScore(D.praxis[D.praxis.length-1]);DRAFT=null;stopTimer();T=null;go('praxis',{part:pid,sub:'hist'});toast('Gespeichert: '+pct(sc)+' %');break;}
  case 'tstart': startTimer();break;
  case 'tpause': pauseTimer();break;
  case 'treset': if(T){stopTimer();T.remain=T.total;T.warned={};T.msg='';paintTimer();}break;
  case 'quiz': SIM=null;startQuiz(ds.cat,ds.type);break;
  case 'quizend': QZ=null;stopTimer();T=null;go('theorie');break;
  case 'ans':{const it=QZ.items[QZ.i];if(it.pick!=null)break;it.pick=+ds.k;it.res=it.opts[it.pick]===it.q.a?'yes':'no';grade(it.q.id,it.res);render();break;}
  case 'show': QZ.items[QZ.i].shown=true;render();break;
  case 'self':{const it=QZ.items[QZ.i];it.res=ds.r;grade(it.q.id,ds.r);render();break;}
  case 'next': QZ.i++;if(QZ.i>=QZ.items.length&&QZ.kind==='sim')stopTimer();render();window.scrollTo(0,0);break;
  case 'case':{V.caseAns=V.caseAns||{};const st=V.caseAns[ds.c]=V.caseAns[ds.c]||{};st[ds.q]=ds.o;const c=CASES.find(x=>x.id===ds.c);if(c.q.every((qq,i)=>st[i]!=null)){D.cases[c.id]=c.q.every((qq,i)=>st[i]===qq[1]);save();}const y=window.scrollY;render();window.scrollTo(0,y);break;}
  case 'diagclear': D.diag={};save();render();break;
  case 'packclear': D.pack={};save();render();break;
  case 'simstart': SIM={i:0};startSimBlock();go('tag');break;
  case 'simnext': SIM.i++;if(SIM.i<simBlocks().length){startSimBlock();startTimer();}else stopTimer();render();window.scrollTo(0,0);break;
  case 'simend': SIM=null;stopTimer();T=null;go('tag');break;
 }});
document.addEventListener('input',e=>{const el=e.target,a=el.dataset&&el.dataset.a;if(!a)return;
 if(a==='pname'){const p=profiles.list.find(x=>x.id===el.dataset.id);if(p){p.name=el.value.slice(0,40);save();renderTabs();}}
 else if(a==='note'&&DRAFT){DRAFT.note=el.value;}
 else if(a==='diagt'){D.diag[el.dataset.k]=el.value;save();}});
document.addEventListener('change',e=>{const el=e.target,a=el.dataset&&el.dataset.a;if(!a)return;
 if(a==='examdate'){D.examDate=el.value;save();render();}
 else if(a==='pack'){D.pack[el.dataset.k]=el.checked;save();el.closest('label').classList.toggle('done',el.checked);const tot=PACK.reduce((x,g)=>x+g.i.length,0),done=Object.values(D.pack).filter(Boolean).length;const pl=document.querySelector('.pack .pill');if(pl){pl.textContent=done+'/'+tot;pl.className='pill num '+(done===tot?'good':'accent');}}
 else if(a==='diag'){if(el.type==='radio')D.diag[el.dataset.k]=el.dataset.v;else D.diag[el.dataset.k]=el.checked;save();const h=diagHint();const hb=$('#dhint');if(hb)hb.innerHTML=h?'<strong>Einschätzung:</strong> '+h:'Kreuze die Hautoberfläche für T-Zone und Wange an, dann bekommst du hier eine Einschätzung des Hauttyps.';}});

render();
</script>
